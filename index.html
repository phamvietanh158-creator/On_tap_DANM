<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Tập Đồ Án Nền Móng</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#16294d;--gold:#e8a020;--green:#16a34a;--red:#dc2626;--orange:#d97706;
  --bg:#f0f4f8;--card:#fff;--border:#e2e8f0;--text:#1e293b;--sub:#64748b;
}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}

/* HEADER */
.header{background:var(--navy);padding:14px 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.header-inner{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.header-logo{color:#fff}
.header-logo .tag{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.header-logo h1{font-size:17px;font-weight:700;margin-top:2px}
.header-stats{display:flex;gap:20px;align-items:center}
.stat-item{text-align:center}
.stat-item .val{font-size:20px;font-weight:800;color:var(--gold)}
.stat-item .lbl{font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.progress-bar{max-width:720px;margin:6px auto 0;background:rgba(255,255,255,.12);border-radius:4px;height:4px}
.progress-fill{height:4px;background:var(--gold);border-radius:4px;transition:width .5s}

/* LANDING */
#screen-landing{max-width:460px;margin:64px auto;padding:0 20px}
.hero{text-align:center;margin-bottom:32px}
.hero-icon{font-size:52px;margin-bottom:12px}
.hero h2{color:var(--navy);font-size:24px;font-weight:800;margin-bottom:8px}
.hero p{color:var(--sub);font-size:14px;line-height:1.8}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.07);overflow:hidden}
.card-body{padding:28px}
label.field-label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:8px}
input.text-input,textarea.text-input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;color:var(--text)}
input.text-input:focus,textarea.text-input:focus{border-color:var(--gold)}
.btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;margin-top:12px}
.btn:hover{background:#1e3a6e;transform:translateY(-1px)}
.btn:disabled{background:#9ca3af;cursor:not-allowed;transform:none}
.btn.btn-gold{background:var(--gold);color:var(--navy)}
.btn.btn-gold:hover{background:#d4911c}
.btn.btn-outline{background:none;border:1.5px solid var(--border);color:var(--sub);font-size:13px}
.btn.btn-outline:hover{border-color:var(--navy);color:var(--navy);background:none;transform:none}
.btn-sm{width:auto;padding:8px 18px;font-size:13px;margin-top:0}
.info-row{text-align:center;color:#94a3b8;font-size:11px;margin-top:10px}
.teacher-section{margin-top:16px}

/* TABS */
.tabs{background:var(--card);border-bottom:2px solid var(--border)}
.tabs-inner{max-width:720px;margin:0 auto;display:flex;padding:0 8px}
.tab-btn{padding:12px 18px;border:none;background:none;font-size:13px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--gold)}
.tab-btn:hover:not(.active){color:var(--navy)}

/* QUIZ */
#screen-quiz{max-width:720px;margin:0 auto;padding:20px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.badge-navy{background:var(--navy);color:#fff}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.remaining{margin-left:auto;color:var(--sub);font-size:12px}
.question-card{background:var(--card);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.question-card .q-label{font-size:10px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px}
.question-card .q-text{font-size:17px;line-height:1.8;font-weight:600;color:var(--text)}
.answer-card{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.answer-card textarea{height:130px;resize:vertical;line-height:1.7}
.answer-hint{font-size:12px;color:var(--sub);margin-top:8px;font-style:italic}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1;margin-top:0}

/* MODEL ANSWER */
.model-answer-wrap{margin-top:16px;border-radius:12px;overflow:hidden;border:2px solid var(--border)}
.model-answer-header{padding:12px 18px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.model-answer-header span{font-size:13px;font-weight:700;color:var(--navy)}
.toggle-icon{font-size:16px;transition:transform .2s}
.model-answer-body{padding:18px;background:#fff;display:none}
.model-answer-body.open{display:block}
.model-answer-body .answer-text{font-size:14px;line-height:1.9;color:#334155;white-space:pre-line}
.key-points{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.key-points .kp-title{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.key-points ul{list-style:none;padding:0}
.key-points li{font-size:13px;color:#475569;padding:4px 0;padding-left:18px;position:relative;line-height:1.6}
.key-points li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:700}

/* SELF RATE */
.self-rate{margin-top:16px;background:var(--card);border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.self-rate .sr-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;text-align:center}
.rate-btns{display:flex;gap:10px}
.rate-btn{flex:1;padding:14px 8px;border:2px solid var(--border);border-radius:12px;background:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.rate-btn .rate-icon{font-size:24px}
.rate-btn.rate-good{border-color:#16a34a;color:#16a34a}
.rate-btn.rate-good:hover,.rate-btn.rate-good.selected{background:#dcfce7;border-color:#16a34a}
.rate-btn.rate-partial{border-color:#d97706;color:#d97706}
.rate-btn.rate-partial:hover,.rate-btn.rate-partial.selected{background:#fef3c7;border-color:#d97706}
.rate-btn.rate-bad{border-color:#dc2626;color:#dc2626}
.rate-btn.rate-bad:hover,.rate-btn.rate-bad.selected{background:#fee2e2;border-color:#dc2626}

/* DONE STATE */
.done-card{background:var(--card);border-radius:16px;padding:48px 24px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.done-card .done-icon{font-size:56px;margin-bottom:16px}
.done-card h3{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:8px}
.done-card p{color:var(--sub);line-height:1.8}

/* TEACHER */
#screen-teacher{max-width:800px;margin:24px auto;padding:0 20px}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.dash-stat{background:var(--card);border-radius:14px;padding:18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.dash-stat .ds-val{font-size:28px;font-weight:800}
.dash-stat .ds-lbl{font-size:11px;color:var(--sub);margin-top:4px}
.table-card{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden}
.table-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.table-header h3{font-size:15px;font-weight:700;color:var(--text)}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;background:#f8fafc;white-space:nowrap}
td{padding:13px 16px;border-top:1px solid #f1f5f9;font-size:13px;vertical-align:middle}
tr:nth-child(even) td{background:#fafafa}
.pbar-wrap{display:flex;align-items:center;gap:8px}
.pbar{width:56px;height:6px;background:#e5e7eb;border-radius:3px}
.pbar-fill{height:6px;border-radius:3px}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.chip-blue{background:#dbeafe;color:#1d4ed8}
.chip-green{background:#dcfce7;color:#15803d}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

@media(max-width:640px){
  .dash-stats{grid-template-columns:repeat(2,1fr)}
  .header-stats .stat-item:last-child{display:none}
  .rate-btn .rate-icon{font-size:18px}
  .tabs-inner{overflow-x:auto}
}
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ═══════════════ LANDING ═══════════════ -->
<div id="screen-landing">
  <div class="hero">
    <div class="hero-icon">🏗️</div>
    <h2>Ôn Tập Bảo Vệ Đồ Án<br>Nền Móng</h2>
    <p>87 câu hỏi bảo vệ + đáp án gợi ý.<br>Tự ôn tập, tự đánh giá, theo dõi tiến độ.</p>
  </div>

  <div class="card card-body" style="margin-bottom:14px">
    <label class="field-label">Họ và tên sinh viên</label>
    <input class="text-input" id="name-input" type="text" placeholder="Ví dụ: Nguyễn Văn A" autocomplete="off">
    <button class="btn" id="btn-start" disabled>Bắt đầu ôn tập →</button>
    <p class="info-row">Tiến độ lưu tự động — quay lại vẫn nhớ đã làm câu nào</p>
  </div>

  <div class="card card-body teacher-section">
    <div id="teacher-toggle-row">
      <button class="btn btn-outline" id="btn-teacher-toggle" onclick="toggleTeacherLogin()">👨‍🏫 Đăng nhập Giảng viên</button>
    </div>
    <div id="teacher-login-form" class="hidden">
      <label class="field-label">Mã giảng viên</label>
      <input class="text-input" id="teacher-code-input" type="password" placeholder="Nhập mã" autocomplete="off">
      <p id="teacher-error" class="hidden" style="color:var(--red);font-size:12px;margin-top:6px"></p>
      <button class="btn" style="margin-top:10px" onclick="loginTeacher()">Vào Dashboard</button>
    </div>
  </div>
</div>

<!-- ═══════════════ QUIZ ═══════════════ -->
<div id="screen-quiz" class="hidden">
  <div class="header">
    <div class="header-inner">
      <div class="header-logo">
        <div class="tag">Ôn Tập Nền Móng</div>
        <h1 id="hdr-name">—</h1>
      </div>
      <div class="header-stats">
        <div class="stat-item"><div class="val" id="hdr-done">0</div><div class="lbl">Đã làm</div></div>
        <div class="stat-item"><div class="val" id="hdr-good" style="color:#4ade80">0</div><div class="lbl">Nắm vững</div></div>
        <div class="stat-item" style="display:flex;align-items:center">
          <button class="btn btn-outline btn-sm" style="margin-top:0;color:#94a3b8;border-color:#334155;font-size:11px" onclick="goLanding()">← Thoát</button>
        </div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="hdr-progress" style="width:0%"></div></div>
  </div>

  <div class="tabs">
    <div class="tabs-inner">
      <button class="tab-btn active" onclick="setFilter('all',this)">Tất cả</button>
      <button class="tab-btn" onclick="setFilter('mong_don',this)">Móng đơn / Băng</button>
      <button class="tab-btn" onclick="setFilter('mong_coc',this)">Móng cọc</button>
    </div>
  </div>

  <div id="screen-quiz-inner" style="max-width:720px;margin:0 auto;padding:20px">
    <!-- Dynamic content here -->
  </div>
</div>

<!-- ═══════════════ TEACHER ═══════════════ -->
<div id="screen-teacher" class="hidden">
  <div class="header">
    <div class="header-inner">
      <div class="header-logo">
        <div class="tag">Giảng Viên</div>
        <h1>Dashboard Lớp Học</h1>
      </div>
      <button class="btn btn-outline btn-sm" style="margin-top:0;color:#94a3b8;border-color:#334155;font-size:12px" onclick="goLanding()">← Thoát</button>
    </div>
  </div>
  <div id="teacher-content"></div>
</div>

<script>
// ═══════════ DATA ═══════════
const TEACHER_CODE = "nenmong2025";
const TOTAL = 87;

const QA = [
// ─── MÓNG ĐƠN / BĂNG ───────────────────────────────
// 1. Phương án móng nông
{id:1,part:"mong_don",topic:"Phương án móng nông",
q:"Trình bày phương án móng nông của em. Giải thích lý do lựa chọn.",
a:`Phương án móng nông (móng đơn/băng) được chọn khi lớp đất đặt móng có sức chịu tải đủ lớn và nằm không quá sâu (thường < 3–5m).

Lý do: Lớp đất 1 (hoặc lớp đặt móng) có các chỉ tiêu cơ lý tốt (φ lớn, c đủ lớn, SPT ≥ 10); chiều dày lớp đủ đảm bảo không bị lún thủng; tải trọng công trình vừa phải. Phương án kinh tế và thi công đơn giản hơn so với móng cọc.`,
kp:["Nêu tên lớp đất đặt móng và chiều sâu chôn móng","Trình bày lý do: chỉ tiêu cơ lý tốt, tải trọng phù hợp","So sánh với phương án khác để chứng minh hợp lý"]},

{id:2,part:"mong_don",topic:"Phương án móng nông",
q:"Lý do em chọn phương án móng nông mà không dùng móng cọc.",
a:`Chọn móng nông vì:
1. Lớp đất đặt móng có SCT đủ lớn (σR lớn), không cần truyền tải xuống sâu.
2. Độ lún dự báo nằm trong giới hạn cho phép [S] = 8cm.
3. Tải trọng công trình vừa phải, không vượt quá khả năng chịu tải của nền tự nhiên.
4. Kinh tế hơn móng cọc khi điều kiện đất cho phép.

Móng cọc chỉ cần thiết khi: nền đất yếu dày, tải trọng lớn, hoặc lún không đảm bảo.`,
kp:["Đất tốt nông → không cần cọc","SCT đủ, lún đảm bảo","Kinh tế hơn"]},

{id:3,part:"mong_don",topic:"Phương án móng nông",
q:"Nếu thay đổi trụ địa chất (lớp yếu dày hơn hoặc xuất hiện lớp mới), phương án móng có thay đổi không?",
a:`Có, phương án móng phụ thuộc trực tiếp vào điều kiện địa chất:

- Nếu lớp yếu dày thêm → SCT giảm, lún tăng → có thể cần đệm cát hoặc móng cọc.
- Nếu xuất hiện lớp đất rất yếu (bùn, sét mềm) → bắt buộc chuyển sang móng cọc hoặc gia cố nền.
- Nếu lớp đất tốt nằm sâu hơn → cân nhắc giữa đệm cát và móng cọc về kinh tế - kỹ thuật.

Quy trình: Đánh giá lại SCT, kiểm tra lún → chọn phương án phù hợp.`,
kp:["Lớp yếu dày → đổi phương án","Phân tích lại SCT và lún","Đệm cát hoặc cọc tùy mức độ"]},

{id:4,part:"mong_don",topic:"Phương án móng nông",
q:"Ngoài phương án móng nông, còn có phương án nào khác có thể áp dụng? Ưu nhược điểm từng phương án.",
a:`3 phương án chính:

1. Móng nông trên nền tự nhiên: Ưu - đơn giản, rẻ; Nhược - chỉ dùng khi đất tốt.
2. Móng nông trên nền gia cố (đệm cát/đệm vật liệu): Ưu - cải thiện SCT, giảm lún; Nhược - phức tạp hơn, chi phí trung bình.
3. Móng cọc: Ưu - phù hợp đất yếu, tải lớn, lún nhỏ; Nhược - chi phí cao, thi công phức tạp.

Lựa chọn dựa trên: chất lượng đất nền, độ sâu lớp tốt, tải trọng công trình và yêu cầu kinh tế.`,
kp:["Nêu đủ 3 phương án","So sánh ưu nhược","Tiêu chí lựa chọn"]},

{id:5,part:"mong_don",topic:"Phương án móng nông",
q:"Vì sao chọn móng nông trên nền tự nhiên chứ không phải móng đệm cát?",
a:`Chọn nền tự nhiên vì lớp đất đặt móng đã có SCT đủ (σR ≥ σtb), không cần cải thiện thêm. Độ lún S ≤ [S] = 8cm ngay cả khi không có đệm cát.

Đệm cát được dùng khi: lớp đất 1 yếu (sét mềm, bùn) → thay bằng vật liệu rời tốt hơn (cát, đá dăm) để tăng SCT và giảm lún cho lớp đất nằm dưới.

Nếu lớp 1 đã tốt → đệm cát vừa tốn kém vừa không cần thiết.`,
kp:["Lớp tự nhiên đã đủ SCT","Lún trong giới hạn cho phép","Đệm cát chỉ dùng khi lớp 1 yếu"]},

{id:6,part:"mong_don",topic:"Phương án móng nông",
q:"Nếu mực nước ngầm dâng cao, phương án móng nông có còn phù hợp không?",
a:`Mực nước ngầm dâng cao ảnh hưởng theo hai chiều:

Bất lợi:
- Dung trọng đẩy nổi (γ') nhỏ hơn γ → SCT giảm (thành phần Nγ·γ·B giảm).
- Ứng suất bản thân giảm → SCT giảm thêm.
- Áp lực thủy động và thủy tĩnh tăng → cần kiểm tra lại.

Xử lý: Tính lại SCT với dung trọng đẩy nổi γ' = (γs - γw)/(1+e); nếu không đảm bảo → mở rộng móng hoặc đổi phương án.

Móng nông có thể vẫn phù hợp nếu điều chỉnh kích thước đáy móng.`,
kp:["Dung trọng đẩy nổi làm giảm SCT","Tính lại SCT khi MNN dâng","Điều chỉnh kích thước hoặc đổi phương án"]},

{id:7,part:"mong_don",topic:"Phương án móng nông",
q:"Trường hợp nào buộc phải đặt móng sâu hơn dù lớp đất hiện tại vẫn tốt?",
a:`Phải đặt sâu hơn khi:
1. Chiều sâu tối thiểu kỹ thuật chưa đạt: hm ≥ 0.5m (thường ≥ 1.0–1.5m) để tránh lớp đất mặt kém ổn định.
2. Ảnh hưởng sương giá (vùng lạnh) → đặt dưới tầm ảnh hưởng đóng băng.
3. Công trình lân cận có móng sâu → đặt ngang bằng hoặc sâu hơn tránh ảnh hưởng.
4. Tải trọng lớn → cần chiều sâu đủ để tăng SCT (Df tăng → q = γ·Df tăng).
5. Ổn định tổng thể (mái dốc, nền yếu) yêu cầu đặt sâu.`,
kp:["Chiều sâu tối thiểu kỹ thuật","Công trình lân cận","Yêu cầu SCT và ổn định"]},

{id:8,part:"mong_don",topic:"Phương án móng nông",
q:"Sự khác nhau giữa móng đơn và móng băng? Khi nào chọn móng đơn, khi nào chọn móng băng?",
a:`Móng đơn: đỡ một cột, mặt bằng hình vuông hoặc chữ nhật, làm việc độc lập.
Móng băng: đỡ hàng cột hoặc tường, dạng dải dài, liên kết các cột với nhau.

Chọn móng đơn: Khi các cột đứng xa nhau, áp lực nền cho phép [σR] lớn, tải trọng không quá lớn, khoảng cách cột đủ lớn để móng không chồng lên nhau.

Chọn móng băng: Khi cột gần nhau hoặc áp lực nền nhỏ, cần phân bố tải trọng đều hơn, hoặc tải trọng lớn khiến móng đơn có kích thước quá lớn (chồng lên nhau).`,
kp:["Móng đơn: 1 cột, độc lập","Móng băng: hàng cột, dải liên tục","Chọn dựa vào khoảng cách cột và SCT"]},

{id:9,part:"mong_don",topic:"Phương án móng nông",
q:"Trình bày các bước thiết kế móng nông trên nền thiên nhiên. Bước nào quan trọng nhất và vì sao?",
a:`Các bước:
1. Xử lý số liệu địa chất: tính chỉ tiêu cơ lý, phân loại đất, vẽ trụ địa chất.
2. Lựa chọn phương án và chiều sâu chôn móng.
3. Chọn sơ bộ kích thước đáy móng (B × L).
4. Kiểm tra SCT (TTGH1): σtb ≤ [σR], σmax ≤ 1.2[σR].
5. Kiểm tra lún (TTGH2): S ≤ [S] = 8cm.
6. Thiết kế kết cấu móng: kiểm tra đâm thủng (tiết diện nghiêng), tính cốt thép (tiết diện đứng).

Bước quan trọng nhất: Kiểm tra đồng thời TTGH1 và TTGH2 — vì đây là điều kiện quyết định kích thước móng đảm bảo an toàn và không lún quá mức.`,
kp:["Đủ 6 bước theo trình tự","Bước TTGH1+TTGH2 quan trọng nhất","Giải thích lý do"]},

{id:10,part:"mong_don",topic:"Phương án móng nông",
q:"So sánh ưu và nhược điểm của móng nông so với móng cọc.",
a:`Móng nông:
+ Ưu: Thi công đơn giản, chi phí thấp, kiểm soát chất lượng dễ.
- Nhược: Chỉ dùng khi đất tốt nằm nông; SCT phụ thuộc lớp đất mặt; lún có thể lớn nếu đất yếu.

Móng cọc:
+ Ưu: Phù hợp đất yếu bất kỳ chiều dày, lún nhỏ, tải lớn.
- Nhược: Chi phí cao, thi công phức tạp (đóng/ép/khoan), cần thiết bị chuyên dụng.

Nguyên tắc: ưu tiên móng nông khi điều kiện địa chất cho phép.`,
kp:["Ưu nhược điểm cả 2 loại","Nguyên tắc lựa chọn","Yếu tố kinh tế - kỹ thuật"]},

// Địa chất
{id:11,part:"mong_don",topic:"Địa chất & lớp đặt móng",
q:"Từ trụ địa chất, làm sao phân biệt được lớp đất tốt và lớp đất yếu?",
a:`Đất tốt (SCT cao): φ lớn (φ > 20° với cát; φ > 15° với sét), c lớn, dung trọng γ cao, hệ số rỗng e nhỏ, chỉ số chảy IL < 0.5 (sét cứng đến nửa cứng), SPT ≥ 10.

Đất yếu (SCT thấp): φ nhỏ, c nhỏ, e lớn, IL > 0.75 (sét mềm đến chảy), γ thấp, mô đun biến dạng E nhỏ, SPT < 5.

Phán đoán từ tên đất + chỉ tiêu: Sét cứng/nửa cứng → tốt; sét mềm/chảy, bùn → yếu; cát chặt → tốt; cát rời → kém.`,
kp:["Chỉ tiêu đất tốt: φ, c, IL, e","Chỉ tiêu đất yếu: IL > 0.75, e lớn","SPT là chỉ tiêu thực tế quan trọng"]},

{id:12,part:"mong_don",topic:"Địa chất & lớp đặt móng",
q:"Nếu lớp 1 là lớp đất yếu, có thể đặt móng lên lớp này không? Nếu không, cần xử lý như thế nào?",
a:`Không nên đặt trực tiếp lên lớp đất yếu vì SCT thấp, lún lớn và không đều.

Biện pháp xử lý:
1. Đệm cát/đệm vật liệu rời: bóc lớp đất yếu, thay bằng cát đầm chặt → tăng SCT.
2. Gia cố nền (cọc cát, cọc đất xi măng, vải địa kỹ thuật): cải tạo tính năng lớp đất yếu.
3. Móng cọc: truyền tải qua lớp yếu xuống lớp đất tốt bên dưới (thích hợp khi lớp yếu dày).

Nguyên tắc: lớp đất yếu mỏng → đệm cát; lớp yếu dày → móng cọc.`,
kp:["Không đặt móng trực tiếp trên đất yếu","3 biện pháp xử lý","Lớp mỏng → đệm cát; lớp dày → cọc"]},

{id:13,part:"mong_don",topic:"Địa chất & lớp đặt móng",
q:"Dựa vào đâu em có thể đặt móng vào lớp đất đó?",
a:`Căn cứ để chọn lớp đặt móng:
1. Sức chịu tải: σR (tính từ φ, c, γ, Df) phải lớn hơn áp lực do công trình gây ra.
2. Biến dạng: dự báo lún S ≤ [S] = 8cm, lớp đất đủ độ cứng (E đủ lớn).
3. Chiều sâu tối thiểu: Df ≥ 1m (thông thường) để tránh lớp đất mặt kém ổn định.
4. Trạng thái đất: IL ≤ 0.5 (sét nửa cứng trở lên) hoặc cát chặt vừa trở lên.
5. Kinh tế: lớp đất đặt móng không quá sâu để tránh tốn kém đào đất.`,
kp:["SCT đủ lớn","Lún trong giới hạn","Chiều sâu tối thiểu và trạng thái đất"]},

{id:14,part:"mong_don",topic:"Địa chất & lớp đặt móng",
q:"Làm thế nào để xác định tính năng xây dựng của các lớp đất và lập trụ địa chất?",
a:`Bước 1: Phân loại đất theo tiêu chuẩn (TCVN): xác định tên đất từ thành phần hạt và chỉ số dẻo Ip.
Bước 2: Xác định trạng thái đất: 
- Đất dính: dùng chỉ số chảy IL = (W - Wp)/(WL - Wp). IL < 0 → cứng; IL = 0–0.25 → nửa cứng; IL = 0.5–0.75 → dẻo; IL > 0.75 → mềm/chảy.
- Đất rời: dùng hệ số rỗng e so với bảng quy chuẩn (hoặc chỉ số SPT).
Bước 3: Đánh giá phẩm chất xây dựng: kết hợp tên đất + trạng thái.
Bước 4: Vẽ trụ địa chất: thể hiện độ sâu, chiều dày, ký hiệu từng lớp, bảng chỉ tiêu cơ lý.`,
kp:["Phân loại theo Ip và thành phần hạt","Chỉ số chảy IL cho đất dính","Trụ địa chất: đủ ký hiệu, chiều dày, chỉ tiêu"]},

// Kích thước móng
{id:15,part:"mong_don",topic:"Kích thước & chiều sâu móng",
q:"Tại sao lại chọn chiều sâu chôn móng như vậy?",
a:`Chiều sâu chôn móng Df được chọn dựa trên các tiêu chí sau:
1. Đặt vào lớp đất tốt đã phân tích (SCT đủ, lún đảm bảo).
2. Đảm bảo chiều sâu tối thiểu: Df ≥ 0.5–1.0m (tránh lớp đất mặt bị xáo trộn, không ổn định).
3. Thoát lớp đất yếu (nếu có): đáy móng nằm hoàn toàn trong lớp đất tốt.
4. Phù hợp tầng hầm/chiều sâu tầng trệt theo yêu cầu kiến trúc.
5. Mực nước ngầm: nếu MNN nông → cân nhắc không đặt móng dưới MNN để tránh phức tạp thi công.`,
kp:["Lớp đất đặt móng tốt","Df tối thiểu kỹ thuật","Tránh lớp đất yếu và MNN"]},

{id:16,part:"mong_don",topic:"Kích thước & chiều sâu móng",
q:"Có thể thay đổi chiều sâu chôn móng không? Nếu có, thay đổi ảnh hưởng gì đến sức chịu tải và độ lún?",
a:`Có thể thay đổi trong giới hạn kỹ thuật.

Tăng Df → SCT tăng (vì q = γ·Df tăng → thành phần Nq·q tăng); lún giảm nhẹ vì vùng ảnh hưởng lún nhỏ hơn.
Giảm Df → SCT giảm; đất mặt kém ổn định hơn; tuy nhiên đào đất ít hơn, rẻ hơn.

Giới hạn: Df không được nhỏ hơn chiều sâu tối thiểu kỹ thuật (~0.5–1m); không được thay đổi nếu điều đó đưa đáy móng vào lớp đất yếu.`,
kp:["Tăng Df → SCT tăng","Tăng Df → lún giảm nhẹ","Không giảm quá Df tối thiểu"]},

{id:17,part:"mong_don",topic:"Kích thước & chiều sâu móng",
q:"Dựa vào đâu để xác định kích thước móng (B, L)?",
a:`Kích thước B, L được xác định từ điều kiện:
1. Điều kiện SCT (TTGH1): σtb = N0/(B·L) + γtb·Df ≤ [σR]; σmax ≤ 1.2[σR].
2. Điều kiện lún (TTGH2): S ≤ [S] = 8cm.
Cả hai điều kiện phải thỏa mãn đồng thời.

Trình tự: Tính sơ bộ B từ công thức σtb ≤ [σR] → kiểm tra lại → nếu lún quá lớn thì tăng B, L thêm.

Yêu cầu kinh tế: không quá lớn gây lãng phí; tỉ lệ L/B ≤ 2 với móng đơn thông thường.`,
kp:["B, L từ điều kiện TTGH1 và TTGH2","Tính sơ bộ từ SCT, kiểm tra lún","Thỏa cả 2 điều kiện đồng thời"]},

{id:18,part:"mong_don",topic:"Kích thước & chiều sâu móng",
q:"Nếu tăng kích thước móng (B, L), ảnh hưởng thế nào đến ứng suất nền và độ lún?",
a:`Tăng B, L:
- Ứng suất nền σtb giảm (phân bố tải trên diện tích lớn hơn) → có lợi cho SCT.
- Chiều sâu vùng ảnh hưởng lún tăng (H ≈ 2.5B) → lún tăng.
- Tải trọng bản thân móng tăng → ứng suất thực tế giảm ít hơn mức kỳ vọng.

Nghịch lý quan trọng: Tăng B giúp thỏa TTGH1 (SCT) nhưng có thể làm vi phạm TTGH2 (lún). → Phải kiểm tra đồng thời cả hai.`,
kp:["B tăng → σtb giảm → lợi cho SCT","B tăng → vùng lún sâu hơn → lún có thể tăng","Phải kiểm tra đồng thời TTGH1 và TTGH2"]},

// Đệm cát
{id:19,part:"mong_don",topic:"Móng đệm cát",
q:"Khi nào nên dùng đệm cát một phần, khi nào dùng đệm cát toàn phần?",
a:`Đệm cát một phần (đệm cát cục bộ): Lớp đất 1 yếu nhưng mỏng (<1.5m), lớp đất 2 tốt. Chỉ đào bỏ lớp yếu dưới đáy móng, thay bằng cát trong phạm vi móng.

Đệm cát toàn phần: Lớp đất 1 yếu vừa phải, toàn bộ diện tích công trình cần xử lý đồng đều. Thi công trước khi đổ bê tông móng.

Nguyên tắc: lớp yếu ≤ 2–3m và nằm trực tiếp dưới đáy móng → dùng đệm cát. Nếu lớp yếu dày > 3m → không kinh tế, cần xem xét cọc.`,
kp:["Một phần: lớp yếu mỏng, tập trung","Toàn phần: xử lý đồng đều toàn diện","Lớp yếu dày → không kinh tế, dùng cọc"]},

{id:20,part:"mong_don",topic:"Móng đệm cát",
q:"Trong đệm toàn phần, tại sao hm thường cao hơn hđ? Giải thích xu hướng.",
a:`hm (chiều sâu đặt móng thực tế) > hđ (chiều dày đệm) xảy ra trong đệm một phần.

Trong đệm toàn phần: Đệm thay thế lớp đất yếu từ mặt đất nên hm = hđ + chiều dày còn lại đến đáy móng, hoặc đáy móng nằm trong đệm.

Xu hướng hm > chiều dày thực nền tự nhiên: Vì phải đào bỏ lớp đất yếu và thay bằng đệm dày hơn → hm tăng → SCT tăng thêm nhờ chiều sâu chôn móng lớn hơn.`,
kp:["hm = chiều sâu chôn móng tính từ mặt đất","Đệm làm tăng chiều sâu hiệu quả","SCT tăng khi hm tăng"]},

{id:21,part:"mong_don",topic:"Móng đệm cát",
q:"Đệm cát dày bao nhiêu, chọn thế nào?",
a:`Chiều dày đệm cát (hc) được xác định theo điều kiện:
1. Kiểm tra SCT lớp đất 2 (dưới đáy đệm): áp lực truyền xuống đáy đệm σz ≤ [σR]₂.
2. Phải bóc hết lớp đất yếu (nếu có): hc ≥ chiều dày lớp yếu dưới đáy móng.
3. Giới hạn kinh tế: hc ≤ 3m (thường).

Công thức sơ bộ: hc thử → tính σz tại đáy đệm → kiểm tra với [σR] lớp 2. Tăng hc nếu không thỏa, giảm nếu quá dư.

Góc phân tán ứng suất trong đệm cát: θ ≈ 30°–35°.`,
kp:["Xác định từ điều kiện SCT lớp 2","Bóc hết lớp yếu","Góc phân tán θ = 30–35°"]},

{id:22,part:"mong_don",topic:"Móng đệm cát",
q:"Ưu điểm và tác dụng của móng đệm cát.",
a:`Tác dụng của đệm cát:
1. Tăng SCT nền: thay lớp đất yếu bằng vật liệu rời có φ lớn hơn.
2. Phân tán ứng suất: ứng suất từ móng phân tán qua lớp đệm với góc θ → diện tích truyền tải lớn hơn.
3. Giảm lún: lớp đất chịu tải thực tế có E lớn hơn, lún nhỏ hơn.
4. Thoát nước: cát đệm tạo lớp thoát nước, đẩy nhanh cố kết.
5. Thi công đơn giản, kinh tế hơn móng cọc khi lớp yếu mỏng.`,
kp:["Tăng SCT và phân tán ứng suất","Giảm lún","Thoát nước, đơn giản, kinh tế"]},

{id:23,part:"mong_don",topic:"Móng đệm cát",
q:"Nếu lớp đất yếu dày, phương án đệm cát có còn hiệu quả không? Khi nào cần chuyển sang móng cọc?",
a:`Đệm cát không hiệu quả khi lớp yếu dày > 2–3m vì:
- Phải đào quá sâu, tốn vật liệu lấp.
- Áp lực truyền xuống vẫn lớn, lớp đất yếu bên dưới vẫn lún nhiều.

Chuyển sang móng cọc khi:
1. Lớp đất yếu dày > 3m.
2. Tải trọng công trình lớn.
3. Kiểm tra với đệm cát vẫn không đảm bảo SCT hoặc lún.
4. Yêu cầu lún rất nhỏ (công trình nhạy cảm).`,
kp:["Đệm cát kém hiệu quả khi lớp yếu > 3m","Chuyển cọc: lớp yếu dày + tải lớn","Kinh tế là yếu tố quyết định"]},

// SCT của nền
{id:24,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Các yếu tố ảnh hưởng đến sức chịu tải của nền đất là gì?",
a:`Theo công thức Terzaghi/TCVN: σR = (A·B·γ + B·Df·γ·Nq + D·c)·kc

Các yếu tố:
1. Góc ma sát trong φ: ảnh hưởng đến Nγ, Nq, Nc. φ tăng → SCT tăng rất nhiều.
2. Lực dính c: đặc biệt quan trọng với đất sét, c tăng → SCT tăng.
3. Chiều sâu chôn móng Df: Df tăng → áp lực bên q = γ·Df tăng → SCT tăng.
4. Chiều rộng móng B: ảnh hưởng thành phần Nγ·B.
5. Dung trọng γ: γ tăng → SCT tăng.
6. Mực nước ngầm: MNN dâng → γ' giảm → SCT giảm.`,
kp:["φ và c là 2 yếu tố chính","Df tăng → SCT tăng","MNN dâng → SCT giảm"]},

{id:25,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Ảnh hưởng của mực nước ngầm đến sức chịu tải của đất như thế nào?",
a:`Khi MNN nằm ngay tại đáy móng hoặc bên dưới:
- Dung trọng đất bên dưới đáy móng giảm từ γ xuống γ' (dung trọng đẩy nổi).
- γ' = (γs - γw)/(1+e) ≈ γ - 10 (kN/m³) → thành phần Nγ·γ'·B giảm → SCT giảm.

Khi MNN nằm trên đáy móng:
- Cả áp lực bên q = γ'·Df cũng giảm → SCT giảm thêm.

Thực tế: SCT có thể giảm 20–40% khi MNN dâng. Cần tính lại với γ' thay γ.`,
kp:["MNN dâng → γ' giảm → SCT giảm","Thay γ bằng γ' trong tính toán","Giảm khoảng 20–40% SCT"]},

{id:26,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Tại sao độ sâu chôn móng lại ảnh hưởng đến sức chịu tải của nền?",
a:`Khi tăng Df, áp lực bên tác dụng lên đất tại đáy móng tăng: q = γ·Df.
Trong công thức SCT, thành phần Nq·q (phản ánh áp lực đất xung quanh giúp giam giữ đất, chống phình ngang) tăng → SCT tăng.

Cơ chế vật lý: Đất xung quanh móng giống như tải trọng phân bố, ngăn cản đất bên dưới đáy móng bị đẩy ngang ra. Df càng lớn, "vòng kiềm chế" này càng chặt → đất dưới đáy móng khó phá hoại hơn → SCT lớn hơn.`,
kp:["Df tăng → q = γ·Df tăng","Thành phần Nq·q tăng → SCT tăng","Cơ chế: đất bên hông chống phình"]},

{id:27,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Nêu công thức tính sức chịu tải của nền theo Terzaghi và giải thích các thành phần (Nc, Nq, Nγ, B, q, γ, c, φ).",
a:`Công thức Terzaghi (móng băng):
σgh = c·Nc + q·Nq + 0.5·γ·B·Nγ

Trong đó:
- c: lực dính đơn vị của đất (kPa)
- Nc, Nq, Nγ: hệ số sức chịu tải, phụ thuộc φ (tra bảng)
- q = γ·Df: áp lực bên (tải trọng phủ tại mức đáy móng)
- γ: dung trọng đất dưới đáy móng
- B: chiều rộng móng

3 thành phần: c·Nc (đóng góp của lực dính), q·Nq (đóng góp áp lực bên), 0.5γBNγ (đóng góp kích thước móng).
SCT tính toán: σR = σgh / Fs (Fs = 2–3).`,
kp:["Công thức 3 thành phần","Nc, Nq, Nγ tra theo φ","σR = σgh/Fs"]},

{id:28,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Điều kiện để kiểm tra sức chịu tải của nền đất là gì? Nêu các điều kiện cần kiểm tra.",
a:`Phải kiểm tra đồng thời 3 điều kiện:
1. σtb ≤ [σR]: áp lực trung bình dưới đáy móng không vượt SCT tính toán.
2. σmax ≤ 1.2[σR]: áp lực lớn nhất (tại mép móng chịu momen) không vượt 1.2 lần SCT.
3. σmin ≥ 0: không có ứng suất kéo dưới đáy móng (nền không thể chịu kéo).

Với móng trung tâm (không lệch tâm): σmax = σmin = σtb → chỉ cần kiểm tra điều kiện 1.`,
kp:["3 điều kiện: σtb, σmax, σmin","σmax ≤ 1.2[σR]","σmin ≥ 0 (không kéo)"]},

{id:29,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Vì sao phải kiểm tra pmax và pmin? Hai giá trị này là gì, tính như thế nào?",
a:`pmax, pmin là áp lực tiếp xúc tại mép xa và mép gần tâm tải khi móng chịu tải lệch tâm (có momen M).

pmax/min = N/(B·L) ± M·(L/2 hoặc B/2) / I = σtb ± σlệch

Lý do kiểm tra:
- pmax: mép chịu nén lớn nhất → tránh phá hoại cục bộ (cho phép ≤ 1.2σR).
- pmin: mép có thể bị kéo → đất không chịu kéo được → tránh gây rỗng, mất ổn định.

Nếu pmin < 0 → cần mở rộng móng hoặc điều chỉnh thiết kế.`,
kp:["pmax/min từ N và M lệch tâm","pmax ≤ 1.2σR; pmin ≥ 0","Kiểm tra 2 mép đối diện"]},

{id:30,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Nếu pmax ≤ 1.2[p], tại vị trí pmax có bị phá hủy không?",
a:`Không bị phá hủy hoàn toàn vì đây là điều kiện cho phép có vùng phá hoại cục bộ nhỏ.

Lý giải: [p] tính với hệ số an toàn Fs = 2–3. Cho phép pmax ≤ 1.2[p] nghĩa là hệ số an toàn tại điểm đó còn khoảng 1.7–2.5, vẫn đủ an toàn. Trong thực tế, khi σmax vượt [p] một chút, chỉ xảy ra biến dạng dẻo cục bộ tại vùng nhỏ; các vùng xung quanh còn trong đàn hồi → toàn móng không mất ổn định.

Điều kiện 1.2[p] là thỏa hiệp giữa an toàn và kinh tế.`,
kp:["Không phá hủy hoàn toàn","Chỉ biến dạng dẻo cục bộ nhỏ","Hệ số an toàn còn đủ lớn"]},

{id:31,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Dùng tải trọng nào để tính sức chịu tải (tải trọng tiêu chuẩn hay tính toán)? Vì sao?",
a:`Dùng tải trọng tiêu chuẩn (TTGH2 theo quan điểm cũ, hoặc tải đặc trưng theo Eurocode) để kiểm tra SCT.

Lý do: SCT tính từ các chỉ tiêu cơ lý trung bình của đất (cũng là giá trị tiêu chuẩn). Việc so sánh tải tiêu chuẩn với SCT tiêu chuẩn là nhất quán về cơ sở thống kê.

Tải trọng tính toán (có hệ số vượt tải n > 1) dùng cho kiểm tra kết cấu bê tông (đâm thủng, cốt thép) — TTGH1 kết cấu.

Tóm lại: SCT nền ↔ tải tiêu chuẩn; kết cấu móng ↔ tải tính toán.`,
kp:["Tải tiêu chuẩn cho SCT nền","Tải tính toán cho kết cấu","Nguyên tắc nhất quán thống kê"]},

{id:32,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Nếu nền không đảm bảo sức chịu tải thì phải xử lý như thế nào?",
a:`Các biện pháp xử lý theo thứ tự ưu tiên kinh tế:
1. Mở rộng kích thước đáy móng (tăng B, L) → σtb giảm.
2. Tăng chiều sâu chôn móng Df → [σR] tăng.
3. Đệm cát: thay lớp đất yếu → tăng SCT lớp đỡ.
4. Gia cố nền: cọc cát, xi măng đất, vải địa kỹ thuật.
5. Thay đổi phương án móng: sang móng băng (nếu đang dùng móng đơn) hoặc móng cọc.

Ưu tiên biện pháp đơn giản nhất trước; chỉ dùng cọc khi các biện pháp trên không hiệu quả hoặc không kinh tế.`,
kp:["Mở rộng B hoặc tăng Df trước","Đệm cát hoặc gia cố nền","Cuối cùng mới đổi sang móng cọc"]},

{id:33,part:"mong_don",topic:"Điều kiện sức chịu tải",
q:"Sức chịu tải giới hạn và sức chịu tải tính toán khác nhau thế nào?",
a:`SCT giới hạn (σgh hay Qu): Tải trọng tối đa mà nền có thể chịu trước khi xảy ra phá hoại trượt tổng thể. Tính từ công thức Terzaghi/Hansen với các thông số đất thực.

SCT tính toán (σR hay qa): σR = σgh / Fs, với Fs = 2–3 (hệ số an toàn).
Đây là giá trị so sánh với áp lực thực tế trong thiết kế.

Ý nghĩa Fs: đảm bảo nền không phá hoại trong điều kiện bình thường, có dự phòng cho sai số địa chất, tải trọng bất ngờ.`,
kp:["σgh: phá hoại tức thời","σR = σgh/Fs: giá trị thiết kế","Fs = 2–3"]},

// SCT lớp đất 2
{id:34,part:"mong_don",topic:"SCT lớp đất dưới đệm",
q:"Vì sao phải kiểm tra sức chịu tải của lớp đất thứ 2 khi móng có lớp đệm cát?",
a:`Vì ứng suất từ móng không kết thúc tại đáy đệm mà tiếp tục truyền xuống lớp đất 2.

Nếu lớp đất 2 yếu hơn lớp đệm cát và áp lực truyền xuống vẫn còn lớn → lớp 2 có thể bị phá hoại hoặc lún quá mức, dù đệm cát đã phân tán ứng suất.

Kiểm tra này đảm bảo toàn bộ hệ móng - đệm - nền đều an toàn, không chỉ tại đáy đệm. Bỏ qua kiểm tra này có thể dẫn đến lún cục bộ hoặc phá hoại trượt sâu.`,
kp:["Ứng suất truyền qua đệm xuống lớp 2","Lớp 2 yếu có thể phá hoại","Đảm bảo an toàn toàn hệ"]},

{id:35,part:"mong_don",topic:"SCT lớp đất dưới đệm",
q:"Trong trường hợp nào cần kiểm tra SCT ở lớp 2? Vì sao với nền tự nhiên thì không cần?",
a:`Cần kiểm tra lớp 2 khi:
- Có đệm cát: áp lực phân tán nhưng vẫn còn đáng kể tại đáy đệm.
- Móng đặt trên lớp 1 nhưng lớp 2 yếu hơn và nằm không quá sâu.

Với nền tự nhiên (không đệm): Móng đặt trực tiếp trên lớp đất tốt, lớp đất tốt này thường đủ dày để phân tán ứng suất trước khi đến lớp 2. Bài toán đã được xử lý trong kiểm tra SCT ban đầu và kiểm tra lún (nếu lớp 2 yếu, nó đã được xét trong bảng tính lún).`,
kp:["Có đệm → phải kiểm tra lớp 2","Nền tự nhiên lớp 1 dày, phân tán đủ","Lớp 2 được xét gián tiếp qua kiểm tra lún"]},

{id:36,part:"mong_don",topic:"SCT lớp đất dưới đệm",
q:"Trình bày cách kiểm tra sức chịu tải lớp đất dưới đáy đệm.",
a:`Bước 1: Xác định kích thước móng quy ước tại đáy đệm:
B' = B + 2·hc·tanθ; L' = L + 2·hc·tanθ (θ = 30° với cát)

Bước 2: Tính áp lực tại đáy đệm:
σ₂ = (N₀ + Gmóng + Gđất trên đệm) / (B'·L')

Bước 3: Tính SCT của lớp đất 2: [σR]₂ theo φ₂, c₂, γ₂ tại chiều sâu Df + hc.

Bước 4: Kiểm tra: σ₂ ≤ [σR]₂. Nếu không thỏa → tăng chiều dày đệm hc.`,
kp:["Móng quy ước mở rộng theo θ = 30°","σ₂ tại đáy đệm","So sánh với [σR]₂ của lớp đất 2"]},

{id:37,part:"mong_don",topic:"SCT lớp đất dưới đệm",
q:"Cách tính áp lực truyền xuống đáy đệm (P₂) như thế nào? Công thức và giả thiết tính toán?",
a:`Giả thiết: Ứng suất phân tán trong đệm cát theo góc θ = 30°–35° (đặc trưng của cát đầm chặt).

Kích thước móng quy ước tại đáy đệm:
B' = B + 2hc·tanθ; L' = L + 2hc·tanθ

Áp lực tại đáy đệm (gây lún và kiểm tra SCT lớp 2):
σ₂ = N / (B'·L') (tải tiêu chuẩn cho kiểm tra SCT)

Ứng suất gây lún: σgl₂ = σ₂ - γ·(Df + hc) (trừ ứng suất bản thân tại độ sâu đó).`,
kp:["θ = 30°–35° trong đệm cát","B' = B + 2hc·tanθ","σ₂ so sánh với [σR]₂"]},

{id:38,part:"mong_don",topic:"SCT lớp đất dưới đệm",
q:"Tại sao khi có đệm cát phải tính theo móng quy ước thay vì móng thật?",
a:`Vì ứng suất từ đáy móng thật (B × L) phân tán ra theo góc θ khi truyền qua đệm cát. Tại đáy đệm (sâu thêm hc), diện tích truyền tải lớn hơn: B' × L'.

Nếu dùng kích thước móng thật B × L để tính áp lực tại đáy đệm → ứng suất tính ra lớn hơn thực tế → thiên về an toàn nhưng không đúng bản chất phân tán.

Móng quy ước phản ánh đúng cơ chế truyền tải thực tế qua đệm → kết quả chính xác hơn, không quá thiên an toàn cũng không nguy hiểm.`,
kp:["Ứng suất phân tán theo θ qua đệm","Diện tích tại đáy đệm lớn hơn B×L","Móng quy ước = B'×L' phản ánh thực tế"]},

// Biến dạng
{id:39,part:"mong_don",topic:"Điều kiện biến dạng",
q:"Sự khác nhau giữa điều kiện sức chịu tải (TTGH1) và điều kiện biến dạng (TTGH2)?",
a:`TTGH1 (Sức chịu tải - Trạng thái giới hạn thứ nhất): kiểm tra khả năng chịu lực, tránh phá hoại đột ngột. Dùng tải trọng tính toán (có hệ số vượt tải). Quan tâm σ ≤ [σ].

TTGH2 (Biến dạng - Trạng thái giới hạn thứ hai): kiểm tra biến dạng, đảm bảo công trình sử dụng bình thường, không bị nứt, nghiêng, mất chức năng. Dùng tải trọng tiêu chuẩn. Quan tâm S ≤ [S].

Cả hai phải thỏa mãn đồng thời. Thực tế: móng nông thường bị chi phối bởi TTGH2 (lún).`,
kp:["TTGH1: phá hoại, tải tính toán","TTGH2: biến dạng, tải tiêu chuẩn","Cả hai phải thỏa đồng thời"]},

{id:40,part:"mong_don",topic:"Điều kiện biến dạng",
q:"Vì sao độ lún cho phép trong đồ án này lấy bằng 8 cm?",
a:`[S] = 8cm là giá trị độ lún cho phép theo TCVN 9362:2012 (Tiêu chuẩn thiết kế nền nhà và công trình) cho công trình dân dụng thông thường (nhà khung bê tông cốt thép nhiều tầng).

Lý do: Lún ≤ 8cm đảm bảo kết cấu không bị nứt, cửa-cửa sổ không bị kẹt, thiết bị không bị lệch. Đây là giới hạn dựa trên kinh nghiệm và thống kê thiệt hại công trình.

Với các loại công trình đặc biệt (nhà máy điện, cầu, ống dẫn dầu...) [S] khác nhau.`,
kp:["[S] = 8cm theo TCVN 9362","Dành cho công trình dân dụng thông thường","Công trình đặc biệt có [S] riêng"]},

{id:41,part:"mong_don",topic:"Điều kiện biến dạng",
q:"Trình bày nguyên lý tính lún bằng phương pháp cộng lún từng lớp. Nêu các bước tính toán.",
a:`Nguyên lý: Nền được chia thành nhiều lớp phân tố nhỏ (dày 0.1B–0.4B). Lún tổng = tổng lún của từng lớp phân tố.

Các bước:
1. Xác định tải trọng tính lún (tải tiêu chuẩn, TTGH2).
2. Tính ứng suất bản thân σbt tại tâm mỗi phân tố.
3. Tính ứng suất do tải ngoài σgl = σbt₀ · K₀ (K₀ tra bảng theo z/B, L/B).
4. Xác định chiều sâu vùng ảnh hưởng lún: σgl ≤ 0.2·σbt.
5. Tính lún từng lớp: Sᵢ = (e₁ᵢ - e₂ᵢ)/(1 + e₁ᵢ) · hᵢ.
6. Tổng lún: S = ΣSᵢ ≤ [S] = 8cm.`,
kp:["Chia lớp, cộng lún từng lớp","Chiều sâu tắt lún: σgl ≤ 0.2σbt","Sᵢ = (e₁-e₂)/(1+e₁)·h"]},

{id:42,part:"mong_don",topic:"Điều kiện biến dạng",
q:"Khi nào lớp đất tắt lún? Dấu hiệu nhận biết điểm tắt lún?",
a:`Đất tắt lún khi ứng suất do tải ngoài gây ra đủ nhỏ so với ứng suất bản thân → đất không nén thêm đáng kể.

Điều kiện tắt lún theo TCVN: σgl ≤ 0.2·σbt (tại điểm đó và các lớp sâu hơn).

Nhận biết trên biểu đồ: Vẽ 2 đường σbt và σgl theo chiều sâu z. Điểm tắt lún là điểm σgl = 0.2·σbt. Các lớp sâu hơn điểm này không tính vào độ lún.

Lưu ý: Nếu gặp lớp đất rất yếu dưới chiều sâu tắt lún, vẫn cần xem xét thêm.`,
kp:["σgl ≤ 0.2·σbt là điều kiện tắt lún","Vẽ 2 đường σbt và σgl","Chỉ tính lún trong vùng ảnh hưởng"]},

{id:43,part:"mong_don",topic:"Điều kiện biến dạng",
q:"Biểu đồ e-p có ý nghĩa gì? Trong bảng tính lún, e₁ᵢ và e₂ᵢ được xác định ra sao?",
a:`Biểu đồ e-p (quan hệ hệ số rỗng - áp lực): thể hiện quá trình nén chặt đất khi áp lực tăng. Đường cong e-p đặc trưng cho tính nén lún của mỗi lớp đất.

Trong bảng tính lún:
- e₁ᵢ: hệ số rỗng ứng với trạng thái ứng suất trước khi xây dựng = σbt tại tâm lớp phân tố. Tra từ đường cong e-p.
- e₂ᵢ: hệ số rỗng sau khi có tải = σbt + σgl tại tâm lớp phân tố. Tra từ đường cong e-p.

Chênh lệch Δe = e₁ - e₂ > 0 → đất bị nén → sinh lún.`,
kp:["e-p: đặc trưng tính nén của đất","e₁: ứng với σbt trước khi xây","e₂: ứng với σbt + σgl sau khi xây"]},

{id:44,part:"mong_don",topic:"Điều kiện biến dạng",
q:"Nếu S > [S], em sẽ xử lý thế nào? Các biện pháp khắc phục?",
a:`Các biện pháp theo thứ tự:
1. Tăng kích thước đáy móng (B, L): giảm σgl → giảm lún. Nhưng vùng ảnh hưởng sâu hơn → cần kiểm tra lại.
2. Tăng chiều sâu chôn móng: đặt móng vào lớp cứng hơn bên dưới.
3. Gia cố nền: tăng mô đun biến dạng E của lớp đất → lún giảm.
4. Đệm cát: thay lớp đất yếu, E_cát >> E_đất yếu.
5. Móng cọc: đưa tải xuống lớp đất ít nén lún hơn.

Lưu ý: tăng B thường làm lún tăng (vùng ảnh hưởng sâu hơn) → nghịch lý → cần phân tích từng trường hợp.`,
kp:["Ưu tiên đổi phương án nền hoặc cọc","Tăng B không luôn giảm lún","Gia cố nền tăng E → giảm lún"]},

{id:45,part:"mong_don",topic:"Điều kiện biến dạng",
q:"Vì sao phải kiểm tra độ lún theo tải trọng tiêu chuẩn mà không dùng tải trọng tính toán?",
a:`Độ lún là hiện tượng dài hạn, xảy ra dưới tải trọng thực tế thường xuyên tác dụng — đó chính là tải trọng tiêu chuẩn (không có hệ số vượt tải).

Tải trọng tính toán = tải tiêu chuẩn × n (n > 1) dùng để kiểm tra phá hoại đột ngột (TTGH1 kết cấu). Nếu dùng tải này để tính lún sẽ cho kết quả quá thiên an toàn, lãng phí vật liệu.

Nguyên tắc: biến dạng → tải tiêu chuẩn; bền vững kết cấu → tải tính toán.`,
kp:["Lún dài hạn = tải thực tế thường xuyên","Tải tiêu chuẩn phản ánh điều kiện thực","Tải tính toán cho TTGH1 kết cấu"]},

// Phá hoại tiết diện nghiêng
{id:46,part:"mong_don",topic:"Phá hoại tiết diện nghiêng",
q:"Phá hoại trên tiết diện nghiêng là gì? Thường xảy ra ở đâu trong móng?",
a:`Phá hoại trên tiết diện nghiêng (còn gọi là chọc thủng hoặc đâm thủng): xảy ra khi áp lực nền đẩy ngược lên đáy móng, cắt qua bê tông dọc theo mặt phẳng nghiêng xung quanh cột/tường.

Vị trí: Mặt phá hoại nghiêng 45° tính từ mép cột/tường đến đáy móng. Hình tháp chóp cụt bị tách ra khỏi phần còn lại của móng.

Cơ chế: Lực đâm thủng Pdt (áp lực nền ngoài tháp) > Lực chống Pcdt (sức kháng cắt của bê tông dọc mặt nghiêng) → đầu cột chọc thủng móng.`,
kp:["Cắt theo mặt phẳng nghiêng 45° quanh cột","Pdt: áp lực ngoài tháp","Pcdt: sức kháng bê tông dọc mặt nghiêng"]},

{id:47,part:"mong_don",topic:"Phá hoại tiết diện nghiêng",
q:"Viết công thức tính lực đâm thủng và công thức xác định khả năng chống đâm thủng.",
a:`Lực đâm thủng (lực gây phá hoại):
Pdt = σtb · F_ngoài_tháp = σtb · (B·L - Btháp·Ltháp)
Trong đó Btháp = bc + 2h₀; Ltháp = lc + 2h₀ (h₀ = chiều cao làm việc của móng)

Lực chống đâm thủng (khả năng bê tông):
Pcdt = α · Rbt · u_trung_bình · h₀
Trong đó: α = 1 (thường); Rbt: cường độ kéo BT; u_tb: chu vi trung bình tháp = 2(Btháp + Ltháp)/2; h₀: chiều cao có ích.

Điều kiện: Pdt ≤ Pcdt.`,
kp:["Pdt = σtb × diện tích ngoài tháp","Pcdt = α·Rbt·u_tb·h₀","Điều kiện: Pdt ≤ Pcdt"]},

{id:48,part:"mong_don",topic:"Phá hoại tiết diện nghiêng",
q:"Tại sao kiểm tra chọc thủng lại lấy góc 45°, không phải góc khác như 60°?",
a:`Góc 45° xuất phát từ thực nghiệm và lý thuyết phá hoại cắt: Mặt phá hoại nghiêng trong bê tông không cốt thép dưới tải tập trung thường hình thành ở góc 45° so với trục tải trọng.

Đây là góc mà ứng suất cắt đạt cực đại theo lý thuyết Mohr-Coulomb cho bê tông. Các tiêu chuẩn thiết kế quốc tế (ACI, Eurocode, TCVN) đều quy định dùng góc này.

Nếu dùng 60°: tháp nhỏ hơn → Pdt lớn hơn → thiên an toàn nhưng không phản ánh đúng thực nghiệm.`,
kp:["Góc 45° từ thực nghiệm phá hoại BT","Ứng suất cắt cực đại theo Mohr","Quy định của tiêu chuẩn TCVN, ACI"]},

{id:49,part:"mong_don",topic:"Phá hoại tiết diện nghiêng",
q:"Nếu chiều cao móng không thỏa điều kiện chống đâm thủng thì phải làm gì?",
a:`Biện pháp xử lý:
1. Tăng chiều cao móng h: tăng h₀ → Pcdt tăng (tỉ lệ thuận); đồng thời Btháp và Ltháp tăng → Pdt giảm. Hiệu quả kép.
2. Tăng cấp độ bền bê tông: Rbt tăng → Pcdt tăng.
3. Tăng kích thước cột (bc, lc): tháp đâm thủng lớn hơn → Pdt giảm, Pcdt tăng.
4. Dùng cốt đai hoặc cốt xiên ở vùng chọc thủng: tiếp nhận thêm lực cắt.

Biện pháp 1 (tăng h) là phổ biến và hiệu quả nhất.`,
kp:["Tăng h: hiệu quả kép (Pdt giảm, Pcdt tăng)","Tăng cấp BT","Tăng kích thước cột"]},

{id:50,part:"mong_don",topic:"Phá hoại tiết diện nghiêng",
q:"Chiều cao móng hợp lý được chọn theo tiêu chí nào?",
a:`Chiều cao móng h được chọn sơ bộ theo hai tiêu chí đồng thời:
1. Kỹ thuật: Đảm bảo điều kiện chống đâm thủng (Pdt ≤ Pcdt) và không cần thép chịu cắt.
2. Kinh tế: Không quá dư (tốn bê tông, tăng trọng lượng móng).

Thực hành: Chọn h sao cho h₀ = (B - bc)/4 (công thức sơ bộ); sau đó kiểm tra lại. Tỉ lệ h/B thường 0.3–0.5.

Cũng phải đảm bảo: chiều dày lớp bê tông bảo vệ ≥ 35mm; khoảng hở lắp đặt cốt thép.`,
kp:["Thỏa điều kiện đâm thủng","Không quá dư về kinh tế","h₀ sơ bộ = (B-bc)/4"]},

// Phá hoại tiết diện đứng
{id:51,part:"mong_don",topic:"Phá hoại tiết diện đứng",
q:"Phá hoại trên tiết diện đứng là gì? Khác gì so với phá hoại tiết diện nghiêng?",
a:`Phá hoại tiết diện đứng (uốn): Áp lực nền gây momen uốn tại mặt cắt qua mép cột, bẻ gãy cánh móng. Phụ thuộc cốt thép chịu momen.

Phá hoại tiết diện nghiêng (cắt): Áp lực nền cắt qua bê tông theo mặt nghiêng 45°. Phụ thuộc chiều cao bê tông và cường độ kéo.

Khác nhau:
- Nghiêng: thiếu chiều cao, thiếu kháng cắt → bê tông bị chọc thủng.
- Đứng: thiếu cốt thép → móng bị gãy uốn.
Cả hai phải kiểm tra và đảm bảo trong thiết kế kết cấu móng.`,
kp:["Đứng: uốn tại mép cột, cần cốt thép","Nghiêng: cắt 45°, cần chiều cao BT","Hai dạng phá hoại khác nhau hoàn toàn"]},

{id:52,part:"mong_don",topic:"Phá hoại tiết diện đứng",
q:"Trình bày sơ đồ tính toán phá hoại theo tiết diện đứng theo phương cạnh ngắn và phương cạnh dài.",
a:`Sơ đồ console (conson): Cánh móng nhô ra khỏi mép cột được xem là dầm console ngàm tại mép cột, chịu tải phân bố là áp lực nền phản lực σ.

Phương cạnh dài (L): Mặt cắt tại y = lc/2 (mép cột theo L).
Momen: M_L = σtb · B · [(L - lc)/2]² / 2

Phương cạnh ngắn (B): Mặt cắt tại x = bc/2 (mép cột theo B).
Momen: M_B = σtb · L · [(B - bc)/2]² / 2

Cốt thép theo mỗi phương tính độc lập. Móng đơn tính cả 2 phương; móng băng chỉ tính phương cạnh ngắn.`,
kp:["Sơ đồ console ngàm tại mép cột","Momen tại mép cột theo 2 phương","Móng băng chỉ tính phương cạnh ngắn"]},

{id:53,part:"mong_don",topic:"Phá hoại tiết diện đứng",
q:"Khi tính thép, momen lấy ở đâu? Cách xác định momen lớn nhất tại mép cột?",
a:`Momen lớn nhất lấy tại tiết diện qua mép cột (đây là tiết diện nguy hiểm nhất, momen cực đại theo sơ đồ console).

Cách tính:
M_max = σtb · b · c² / 2
Trong đó: b = chiều rộng móng theo phương vuông góc; c = chiều dài cánh console = (B - bc)/2 hoặc (L - lc)/2.

Nếu tải lệch tâm: dùng σtb tương ứng trong phạm vi cánh móng (thường lấy ứng suất trung bình tại mặt cắt đang xét).

Diện tích cốt thép: As = M_max / (0.9·h₀·Rs).`,
kp:["Momen tại mép cột - tiết diện nguy hiểm","M = σtb·b·c²/2","As = M/(0.9·h₀·Rs)"]},

{id:54,part:"mong_don",topic:"Phá hoại tiết diện đứng",
q:"Vì sao khi kiểm tra móng đơn thì tính theo hai phương, còn móng băng thì chỉ tính theo phương cạnh ngắn?",
a:`Móng đơn: có kích thước hữu hạn cả 2 chiều → cánh console nhô ra theo cả 2 phương → phải tính thép cả 2 phương.

Móng băng: kéo dài vô hạn theo phương dọc (L >> B) → trong mặt phẳng dọc (phương dài), móng làm việc như dầm liên tục đỡ bởi đất nền → không có console nhô ra theo phương dài. Chỉ có cánh nhô ra theo phương ngang (ngắn).

Do đó chỉ cần tính cốt thép theo phương ngắn. Phương dọc chọn cốt thép theo cấu tạo (thường ≥ 0.1% diện tích tiết diện).`,
kp:["Móng đơn: console 2 phương → thép 2 phương","Móng băng: vô hạn dọc → không có console dọc","Phương dài: thép cấu tạo"]},

// ─── MÓNG CỌC ───────────────────────────────────────
{id:55,part:"mong_coc",topic:"Phương án móng cọc",
q:"Khi nào thì phải thiết kế móng cọc mà không phải móng nông?",
a:`Cần dùng móng cọc khi:
1. Lớp đất tốt nằm sâu: móng nông không tiếp cận được lớp đất đủ SCT.
2. Đất yếu dày: SCT thấp, lún lớn, móng nông không đảm bảo TTGH1 và TTGH2.
3. Tải trọng lớn: móng nông cần diện tích đáy quá lớn, kinh tế kém.
4. Yêu cầu lún rất nhỏ: công trình nhạy cảm (bệnh viện, nhà máy điện...).
5. Ổn định chống trượt, nhổ: cọc chịu tải ngang hoặc kéo.
6. Công trình ven sông, biển: bảo vệ xói lở.`,
kp:["Đất yếu dày, lớp tốt sâu","Tải lớn, lún nhỏ","Ổn định đặc biệt"]},

{id:56,part:"mong_coc",topic:"Phương án móng cọc",
q:"Phân tích địa tầng các lớp đất theo trụ địa chất để chọn vị trí đặt mũi cọc.",
a:`Từ trụ địa chất, đánh giá từng lớp:
- Lớp yếu (sét mềm/chảy, bùn): không đặt mũi cọc.
- Lớp trung bình: có thể dừng tạm nếu tải không lớn.
- Lớp tốt (sét cứng/nửa cứng, cát chặt, đá...): đây là lớp đặt mũi cọc lý tưởng.

Tiêu chí: Mũi cọc phải đặt trong lớp đất tốt ít nhất 1–2m. SCT tại đầu mũi đủ lớn. Không đặt tại ranh giới lớp (dễ dao động SCT).

Kinh tế: Không sâu hơn mức cần thiết; chiều dài cọc L = chiều sâu lớp tốt - chiều sâu đặt đài.`,
kp:["Mũi vào lớp tốt ít nhất 1–2m","Không đặt lớp yếu hay ranh giới","Tối ưu chiều dài kinh tế"]},

{id:57,part:"mong_coc",topic:"Phương án móng cọc",
q:"Có được đặt mũi cọc vào lớp đất yếu không? Vì sao?",
a:`Không nên đặt mũi cọc vào lớp đất yếu vì:
1. SCT mũi cọc Qp rất nhỏ (thành phần mũi thấp).
2. Lún đầu cọc lớn do biến dạng mũi cao.
3. Cọc không được "neo" chắc, có thể tiếp tục lún theo thời gian (cố kết lớp yếu).
4. Độ tin cậy thấp, rủi ro cao.

Ngoại lệ: Cọc ma sát (friction pile) hoạt động chủ yếu nhờ ma sát thân cọc, mũi có thể nằm trong lớp đất có SCT trung bình — nhưng vẫn không được đặt vào bùn/sét chảy.`,
kp:["SCT mũi nhỏ, lún lớn","Không neo chắc, cố kết tiếp","Cọc ma sát: mũi có thể ở đất TB"]},

{id:58,part:"mong_coc",topic:"Phương án móng cọc",
q:"Tại sao trong thiết kế luôn yêu cầu mũi cọc đâm sâu vào lớp đất tốt ít nhất 2m?",
a:`Lý do:
1. Đảm bảo tính liên tục của lớp đất tốt: Tránh trường hợp mũi nằm sát ranh giới, SCT bất ổn.
2. Phát triển đủ SCT mũi: Ma sát và sức kháng mũi cần chiều dài ngàm đủ để phát triển.
3. Tránh dịch chuyển đầu mũi khi ép: Khi ép cọc, mũi bị dịch ra khỏi lớp nếu cắm không sâu.
4. An toàn tính toán: Dao động địa tầng theo không gian → ngàm sâu đảm bảo cọc luôn trong lớp tốt dù địa chất thay đổi nhẹ.`,
kp:["Tránh mũi gần ranh giới","SCT mũi cần chiều sâu đủ phát triển","Dao động địa tầng → cần dự phòng"]},

{id:59,part:"mong_coc",topic:"Phương án móng cọc",
q:"Trình bày cách chọn chiều dài và tiết diện cọc.",
a:`Chiều dài cọc (L):
L = chiều sâu mũi cọc - cao độ đáy đài
= (chiều sâu đỉnh lớp tốt + 1–2m ngàm) - hđài

Tiết diện cọc (cạnh a hoặc đường kính D):
- Quy tắc kinh nghiệm: tải lớn → cọc to; cọc dài → nên dùng cọc to để tránh mảnh.
- Kích thước phổ biến: 20×20, 25×25, 30×30, 35×35, 40×40 cm.
- Tỉ lệ L/a ≤ 100 (hạn chế uốn dọc).

Sau khi chọn sơ bộ: tính SCT theo đất và vật liệu → sơ bộ số cọc → bố trí trong đài.`,
kp:["L từ vị trí mũi và đáy đài","a/D từ tải trọng và chiều dài","L/a ≤ 100 tránh mảnh"]},

{id:60,part:"mong_coc",topic:"Phương án móng cọc",
q:"Nếu giảm hoặc tăng kích thước cọc, điều gì sẽ thay đổi trong tính toán?",
a:`Tăng kích thước cọc (a lớn hơn):
+ SCT theo đất tăng: cả ma sát thân (chu vi lớn hơn) và sức kháng mũi (diện tích mũi lớn hơn).
+ SCT vật liệu tăng.
- Số cọc giảm; đài nhỏ hơn, rẻ hơn.
- Chi phí mỗi cọc tăng; thi công khó hơn.

Giảm kích thước cọc: ngược lại — SCT giảm, cần nhiều cọc hơn, đài to hơn.

Tối ưu: chọn kích thước để số lượng cọc vừa phải, đài không quá lớn, kinh tế.`,
kp:["Tăng a → SCT tăng, số cọc giảm","Giảm a → SCT giảm, cần nhiều cọc","Tối ưu giữa kích thước và số lượng"]},

// SCT cọc
{id:61,part:"mong_coc",topic:"Sức chịu tải cọc",
q:"Thế nào là sức chịu tải của cọc? Sức chịu tải giới hạn và sức chịu tải cho phép khác nhau như thế nào?",
a:`SCT của cọc: Tải trọng tối đa mà cọc có thể chịu được theo 2 điều kiện: (1) điều kiện đất nền (ma sát thân + sức kháng mũi) và (2) điều kiện vật liệu (bê tông + cốt thép cọc).

SCT giới hạn (Qu): Tải gây phá hoại thực sự; tính từ thí nghiệm hoặc công thức.
SCT cho phép/tính toán (Rc,d hay [P]): Rc,d = Rc,k / γk (chia hệ số an toàn/tin cậy).

Trong đồ án: Rc,d = min{SCT theo thống kê/Fs₁; SCT theo SPT/Fs₂; SCT vật liệu} → lấy giá trị nhỏ nhất để thiên an toàn.`,
kp:["SCT = min(đất nền, vật liệu)","SCT giới hạn / Fs = SCT tính toán","Lấy min các phương pháp"]},

{id:62,part:"mong_coc",topic:"Sức chịu tải cọc",
q:"Những yếu tố ảnh hưởng đến sức chịu tải của cọc là gì?",
a:`1. Đặc trưng đất nền: φ, c, SPT N → ảnh hưởng cả ma sát thân và sức kháng mũi.
2. Kích thước cọc: a (cạnh) và L (chiều dài). Tăng L → ma sát thân tăng; tăng a → sức kháng mũi tăng.
3. Phương pháp hạ cọc: Cọc ép → đất bị nén chặt quanh cọc → SCT cao hơn cọc khoan; cọc đóng → tương tự.
4. Vật liệu cọc: cường độ bê tông, diện tích tiết diện.
5. Thời gian: SCT tăng sau khi hạ cọc (do đất cố kết lại xung quanh cọc).
6. MNN: ảnh hưởng gián tiếp qua áp lực ngang của đất.`,
kp:["φ, c, SPT của đất","Kích thước L và a","Phương pháp hạ cọc, thời gian"]},

{id:63,part:"mong_coc",topic:"Sức chịu tải cọc",
q:"Kể tên các phương pháp xác định sức chịu tải cọc trong đồ án. Trình bày cách tính theo từng phương pháp.",
a:`Trong đồ án thường dùng 2–3 phương pháp:

1. Phương pháp thống kê (dùng chỉ tiêu cơ lý):
Rc,k = u·Σfi·li + Ap·qp
fi: ma sát đơn vị tra bảng theo loại đất và chiều sâu; qp: sức kháng mũi tra bảng; u: chu vi cọc; Ap: diện tích mũi.

2. Phương pháp SPT:
Rc,k = K·N_SPT·Ap + u·Σfs,i·li
(Công thức Meyerhof hoặc TCVN)

3. SCT theo vật liệu:
Rc,m = φ·(Rb·Ab + Rs·As)

Cuối cùng: Rc,d = min{Rc,k/γk1; Rc,k(SPT)/γk2; Rc,m}`,
kp:["PP thống kê: fi, qp tra bảng","PP SPT: dùng chỉ số N","Vật liệu: Rb, Rs, φ"]},

{id:64,part:"mong_coc",topic:"Sức chịu tải cọc",
q:"Sau khi tính xong, tại sao lại lấy giá trị nhỏ nhất trong các phương pháp làm kết quả thiết kế?",
a:`Vì SCT thực của cọc bị kiểm soát bởi mắt xích yếu nhất. Cụ thể:

- Nếu SCT vật liệu < SCT đất: cọc bị gãy/nứt trước khi đất phá hoại → lấy SCT vật liệu.
- Nếu SCT đất < SCT vật liệu: đất xung quanh phá hoại trước → lấy SCT đất.

Nguyên tắc thiết kế: Phá hoại xảy ra theo cơ chế nào diễn ra trước → lấy giá trị nhỏ nhất đảm bảo an toàn toàn diện.

Tương tự như xích: độ bền = độ bền mắt xích yếu nhất.`,
kp:["Phá hoại theo cơ chế yếu nhất trước","Thiết kế an toàn toàn diện","Giống nguyên tắc mắt xích yếu nhất"]},

{id:65,part:"mong_coc",topic:"Sức chịu tải cọc",
q:"Mực nước ngầm có ảnh hưởng đến sức chịu tải của cọc không? Giải thích.",
a:`Có, ảnh hưởng gián tiếp:
1. Áp lực ngang của đất giảm (dung trọng đẩy nổi γ' thay γ) → ma sát thân cọc theo phương pháp β giảm.
2. Ứng suất hữu hiệu giảm → SCT mũi theo phương pháp φ có thể giảm nhẹ.
3. Ảnh hưởng lên cọc theo phương pháp bảng tra (phương pháp thống kê): ít ảnh hưởng vì fi tra trực tiếp theo loại đất và chiều sâu.

Thực tế: Ảnh hưởng của MNN lên SCT cọc nhỏ hơn so với móng nông. Cọc truyền lực xuống sâu nơi ứng suất hữu hiệu lớn hơn.`,
kp:["MNN giảm áp lực ngang → ma sát giảm nhẹ","Ít ảnh hưởng với phương pháp bảng tra","Cọc ít nhạy MNN hơn móng nông"]},

// Kiểm tra sử dụng
{id:66,part:"mong_coc",topic:"Kiểm tra cọc - Sử dụng (TTGH1)",
q:"Trình bày các giả thiết tính toán cọc trong giai đoạn sử dụng.",
a:`3 giả thiết cần và đủ để tính phân phối tải trọng lên cọc theo công thức giải tích:

1. Đài cọc tuyệt đối cứng: không biến dạng, mặt phẳng đáy đài vẫn phẳng sau khi chịu tải.
2. Cọc là thanh thẳng đứng tuyệt đối cứng, liên kết ngàm với đài.
3. Cọc chỉ chịu lực dọc trục (nén hoặc kéo), không chịu momen và lực ngang (tải ngang do đất bên gánh).

Với 3 giả thiết này: Tải trọng phân phối lên cọc tỉ lệ với khoảng cách từ cọc đến trục trung hòa (giống phân phối ứng suất trong tiết diện chịu uốn).`,
kp:["Đài tuyệt đối cứng","Cọc cứng, ngàm với đài","Cọc chỉ chịu lực dọc trục"]},

{id:67,part:"mong_coc",topic:"Kiểm tra cọc - Sử dụng (TTGH1)",
q:"Pmax, Pmin là gì? Viết công thức xác định và ý nghĩa của chúng.",
a:`Pmax, Pmin là lực dọc trục lớn nhất và nhỏ nhất phân phối lên cọc trong đài khi có tải lệch tâm.

Công thức:
Pᵢ = N/(n) ± Mx·yᵢ/Σyᵢ² ± My·xᵢ/Σxᵢ²
Pmax = tại cọc xa nhất về phía momen dương
Pmin = tại cọc xa nhất về phía momen âm

Ý nghĩa:
- Pmax ≤ Rc,d: cọc chịu nén không bị vượt tải.
- Pmin ≥ 0 (nếu cọc không chịu kéo) hoặc Pmin ≥ -Rt,d (nếu cọc chịu kéo).`,
kp:["Pᵢ = N/n ± M·x/Σx²","Pmax ≤ Rc,d","Pmin ≥ 0 (thường) hoặc ≥ -Rt,d"]},

{id:68,part:"mong_coc",topic:"Kiểm tra cọc - Sử dụng (TTGH1)",
q:"Thế nào là điều kiện kinh tế (≤10%) và mục đích của điều kiện này?",
a:`Điều kiện kinh tế: Pmax không được nhỏ hơn quá 10% so với Rc,d.
Tức là: Pmax ≥ 0.9·Rc,d (hoặc Rc,d - Pmax ≤ 0.1·Rc,d = 10%).

Mục đích: Nếu Pmax << Rc,d → cọc được dùng lãng phí, có thể giảm số cọc hoặc giảm kích thước cọc mà vẫn an toàn. Buộc kỹ sư phải tối ưu thiết kế.

Ví dụ: Rc,d = 500 kN; nếu Pmax = 400 kN → thiên an toàn 20% → lãng phí, cần tối ưu lại (giảm cọc hoặc giảm tiết diện).`,
kp:["Pmax ≥ 0.9·Rc,d","Tránh lãng phí: không dùng quá ít so với SCT","Buộc tối ưu thiết kế"]},

{id:69,part:"mong_coc",topic:"Kiểm tra cọc - Sử dụng (TTGH1)",
q:"Khoảng cách giữa các tim cọc thường chọn trong khoảng bao nhiêu? Tại sao?",
a:`Khoảng cách tim cọc: 3dc ≤ s ≤ 6dc (dc: cạnh hoặc đường kính cọc). Phổ biến nhất: s = 3dc.

Tại sao ≥ 3dc:
- Tránh hiệu ứng nhóm cọc: Các cọc quá gần nhau sẽ ảnh hưởng lẫn nhau về ứng suất, làm giảm SCT của từng cọc.
- Đảm bảo thi công: Đủ khoảng cách để đóng/ép cọc mà không làm bung cọc đã hạ.

Tại sao ≤ 6dc: Đài quá lớn → tốn bê tông, tăng tải trọng bản thân, kinh tế kém.

Khoảng mép cọc đến mép đài ≥ 250mm (yêu cầu cấu tạo).`,
kp:["3dc ≤ s ≤ 6dc","≥ 3dc: tránh hiệu ứng nhóm, đảm bảo thi công","Mép cọc đến mép đài ≥ 250mm"]},

{id:70,part:"mong_coc",topic:"Kiểm tra cọc - Sử dụng (TTGH1)",
q:"Cọc biên và cọc giữa chịu tải khác nhau thế nào khi đài chịu momen?",
a:`Khi đài chịu momen M (do tải lệch tâm):
- Công thức: Pᵢ = N/n ± M·xᵢ/Σxᵢ²
- Cọc biên (xa trục): xᵢ lớn → Pᵢ lớn hơn (về phía tăng tải) hoặc nhỏ hơn (về phía giảm tải).
- Cọc giữa (gần trục): xᵢ nhỏ hoặc bằng 0 → Pᵢ ≈ N/n (ít bị ảnh hưởng bởi momen).

Hệ quả: Cọc biên phía chịu nén thêm nguy hiểm nhất → cần kiểm tra Pmax với Rc,d. Cọc biên phía kéo có thể bị kéo nếu Pmin < 0.`,
kp:["Cọc biên: chịu tải lớn nhất khi có momen","Cọc giữa: gần không ảnh hưởng bởi M","Pmax ở cọc biên → kiểm tra với Rc,d"]},

{id:71,part:"mong_coc",topic:"Kiểm tra cọc - Sử dụng (TTGH1)",
q:"Nếu không thỏa điều kiện kinh tế (≤10%) thì điều chỉnh giá trị nào?",
a:`Nếu Pmax < 0.9·Rc,d (dùng cọc quá dư):
Điều chỉnh theo thứ tự:
1. Giảm số lượng cọc: n giảm → N/n tăng → Pmax tăng.
2. Giảm kích thước cọc (a nhỏ hơn): Rc,d giảm → tỉ lệ Pmax/Rc,d tăng.
3. Giảm chiều dài cọc: Rc,d giảm theo.

Lưu ý: Khi giảm số cọc hoặc kích thước, phải kiểm tra lại toàn bộ (SCT, lún, đài).

Mục tiêu: 0.9·Rc,d ≤ Pmax ≤ Rc,d (vừa an toàn vừa kinh tế).`,
kp:["Giảm số cọc hoặc kích thước","Kiểm tra lại sau khi điều chỉnh","Mục tiêu: 0.9Rc,d ≤ Pmax ≤ Rc,d"]},

// Thi công cọc
{id:72,part:"mong_coc",topic:"Kiểm tra cọc - Thi công",
q:"Kiểm tra cọc trong giai đoạn thi công gồm những kiểm tra nào? Vì sao phải kiểm tra?",
a:`Giai đoạn thi công, cọc chịu các trạng thái tải trọng khác hoàn toàn so với giai đoạn sử dụng:

1. Vận chuyển cọc: Cọc nằm ngang, chịu trọng lượng bản thân → uốn theo 2 sơ đồ tùy vị trí móc cẩu.
2. Lắp dựng/cẩu lắp cọc: Cọc treo dọc, chịu uốn tại điểm cẩu.
3. Hạ cọc (đóng/ép): Đầu cọc chịu lực đóng/ép → ứng suất động, nguy cơ nứt đầu.
4. Kiểm tra thép móc cẩu: Đảm bảo thép không bị đứt khi cẩu.

Vì sao cần: Ứng suất kéo khi vận chuyển có thể lớn hơn SCT chịu kéo của BT → nứt cọc trước khi sử dụng.`,
kp:["4 trạng thái: vận chuyển, cẩu, đóng/ép, móc cẩu","Cọc chịu uốn khi nằm ngang","Nguy cơ nứt kéo > BT chịu kéo"]},

{id:73,part:"mong_coc",topic:"Kiểm tra cọc - Thi công",
q:"Trong quá trình vận chuyển, móc cẩu được đặt ở vị trí nào? Vì sao?",
a:`Móc cẩu đặt tại vị trí 0.207L từ mỗi đầu cọc (cách đầu cọc 0.207L).

Lý do: Khi cọc được đỡ tại 2 điểm cách mỗi đầu 0.207L, momen tại 2 điểm đỡ và momen tại giữa nhịp bằng nhau về giá trị tuyệt đối → tối thiểu hóa momen lớn nhất → cọc được thiết kế đồng đều nhất.

Nếu đặt móc sai vị trí: momen một đoạn quá lớn → nguy cơ nứt.

Kiểm tra: M_max tính từ vị trí móc cẩu → so sánh với khả năng chịu momen của tiết diện cọc.`,
kp:["Vị trí 0.207L từ đầu cọc","Momen 2 điểm = momen giữa → tối ưu","Sai vị trí → momen cục bộ lớn → nứt"]},

{id:74,part:"mong_coc",topic:"Kiểm tra cọc - Thi công",
q:"Có những phương pháp hạ cọc nào? Phân biệt ép cọc và đóng cọc.",
a:`Các phương pháp hạ cọc:
1. Đóng cọc (búa): Dùng búa rơi tự do hoặc búa diesel đóng cọc xuống.
2. Ép cọc (tĩnh): Dùng lực ép tĩnh từ máy ép thủy lực.
3. Khoan nhồi: Khoan tạo lỗ trước, đổ BT sau tại chỗ.

Đóng vs Ép:
- Đóng: tiếng ồn, rung chấn lớn, phù hợp ngoài đô thị; SCT kiểm tra bằng công thức nhát búa cuối.
- Ép: êm, phù hợp trong đô thị; SCT kiểm tra bằng lực ép cuối cùng (Pep,min ≤ lực ép ≤ Pep,max).
- Cả hai: cần hạ đủ chiều sâu thiết kế hoặc đến khi đạt điều kiện dừng.`,
kp:["3 phương pháp chính","Đóng: ồn, rung; Ép: êm, đô thị","Điều kiện dừng: độ chối hoặc lực ép cuối"]},

{id:75,part:"mong_coc",topic:"Kiểm tra cọc - Thi công",
q:"Tại sao trong giai đoạn thi công, dù cọc chịu nén là chủ yếu, vẫn cần bố trí thép dọc và thép đai?",
a:`Thép dọc: Dù cọc chủ yếu chịu nén khi sử dụng, trong giai đoạn vận chuyển và cẩu lắp, cọc nằm ngang chịu uốn → xuất hiện ứng suất kéo lớn → BT không chịu kéo được → cần thép dọc chịu kéo.

Thép đai: Chống nứt do ứng suất cắt trong vận chuyển; đặc biệt tại đầu cọc — vùng chịu lực ép/đóng cực lớn, thép đai giữ BT không bị nứt vỡ hông.

Tại vùng đầu cọc (0.5–1m): thép đai dày hơn (bước đai nhỏ hơn) để chịu ứng suất tập trung khi đóng/ép.`,
kp:["Thép dọc: chịu kéo khi vận chuyển","Thép đai: chống nứt tại đầu cọc","Đầu cọc: đai dày hơn"]},

{id:76,part:"mong_coc",topic:"Kiểm tra cọc - Thi công",
q:"Tại sao phần thép đầu cọc thường bẻ chéo ra ngoài một góc 45°?",
a:`Sau khi hạ cọc, phần đầu cọc bị đập vỡ bê tông bảo vệ để lộ thép dọc. Phần thép này cần được neo vào bê tông đài để truyền lực từ đài xuống cọc và ngược lại.

Bẻ thép 45° hướng ra ngoài: Tăng chiều dài neo thép trong bê tông đài, đảm bảo liên kết ngàm chắc. Nếu để thẳng đứng, chiều dài neo bị giới hạn bởi chiều cao đài → có thể không đủ.

Lưu ý: Chiều dài cắm vào đài ≥ Lneo (theo tính toán hoặc cấu tạo). Thép bẻ 45° cũng giúp định vị cọc trong đài.`,
kp:["Neo thép cọc vào đài BT","Bẻ 45°: tăng chiều dài neo","Đảm bảo liên kết ngàm cọc-đài"]},

{id:77,part:"mong_coc",topic:"Kiểm tra cọc - Thi công",
q:"Điều kiện để chọn vị trí móc cẩu (M) là gì? Nếu thay đổi vị trí móc cẩu thì ảnh hưởng gì?",
a:`Điều kiện chọn vị trí móc cẩu:
- Vận chuyển (2 điểm): Momen tại điểm cẩu (M₁) = Momen ở giữa nhịp (M₂) → vị trí tối ưu: 0.207L.
- Cẩu lắp (1 điểm): Momen tại điểm cẩu = Momen tại đầu cọc → vị trí tối ưu: 0.293L.

Nếu thay đổi vị trí:
- Dịch về phía đầu: đoạn đầu ngắn hơn, đoạn cuối dài → momen giữa tăng.
- Dịch vào giữa: momen tại điểm cẩu tăng, đoạn đầu bị kéo lớn.
Cả hai làm tăng M_max → nguy cơ nứt cọc tăng.`,
kp:["Vận chuyển: 0.207L; Cẩu lắp: 0.293L","Dịch vị trí → M_max tăng","Kiểm tra đủ với tiết diện thép cọc"]},

// Biến dạng nền mũi cọc
{id:78,part:"mong_coc",topic:"Biến dạng nền dưới mũi cọc",
q:"Vì sao cần kiểm tra biến dạng của nền đất dưới mũi cọc?",
a:`Dù cọc chịu lực tốt, nền đất dưới mũi cọc vẫn có thể lún nếu lớp đất đó có tính nén lún cao (E nhỏ, e lớn).

Lún tổng thể của móng cọc = lún đàn hồi thân cọc (nhỏ, bỏ qua) + lún nền dưới mũi cọc (quan trọng).

Nếu không kiểm tra: Công trình có thể đáp ứng SCT (không phá hoại) nhưng lún quá mức [S] → nứt, nghiêng, hỏng hóc trong giai đoạn sử dụng.

Đây là kiểm tra TTGH2 cho móng cọc.`,
kp:["Lún tổng = lún nền dưới mũi","SCT đủ nhưng vẫn lún nếu E nhỏ","TTGH2 của móng cọc"]},

{id:79,part:"mong_coc",topic:"Biến dạng nền dưới mũi cọc",
q:"Nêu cách xác định khối móng quy ước khi tính biến dạng nền dưới mũi cọc.",
a:`Khối móng quy ước (KMQU) là khối đất bao gồm đài + cọc + đất giữa các cọc, giới hạn bởi góc mở φtb/4.

Kích thước KMQU:
Lqu = Lđài + 2·Lcọc·tan(φtb/4)
Bqu = Bđài + 2·Lcọc·tan(φtb/4)

φtb: góc ma sát trung bình của các lớp đất cọc đi qua (bình quân gia quyền theo chiều dày).

Đáy KMQU = ngang mũi cọc.
Áp lực tại đáy KMQU: σqu = (N + Gqu) / (Lqu·Bqu) → kiểm tra SCT và tính lún.`,
kp:["KMQU: đài + cọc + đất giữa","Mở rộng theo φtb/4","Lqu = Lđài + 2L·tan(φtb/4)"]},

{id:80,part:"mong_coc",topic:"Biến dạng nền dưới mũi cọc",
q:"Nếu kết quả kiểm tra biến dạng nền không đảm bảo, có các biện pháp xử lý nào?",
a:`Các biện pháp:
1. Tăng chiều dài cọc: Đưa mũi cọc xuống lớp đất cứng hơn (E lớn hơn, e nhỏ hơn) → lún giảm.
2. Tăng số lượng cọc: Áp lực tại mũi mỗi cọc giảm → lún giảm.
3. Tăng kích thước cọc: Diện tích mũi lớn → ứng suất giảm.
4. Thay đổi vị trí đặt mũi cọc: Từ lớp đất trung bình sang lớp đất cứng hơn.
5. Gia cố đất dưới mũi cọc (phun xi măng, jet grouting): tăng E của đất.`,
kp:["Tăng L cọc xuống lớp cứng hơn","Tăng số cọc giảm ứng suất mũi","Gia cố đất dưới mũi"]},

{id:81,part:"mong_coc",topic:"Biến dạng nền dưới mũi cọc",
q:"Trình bày cách tính lún cho nền đồng nhất khi kiểm tra biến dạng nền dưới mũi cọc.",
a:`Khi lớp đất dưới mũi cọc chỉ có một lớp đồng nhất (hoặc coi là đồng nhất):

Áp lực gây lún: σgl = σqu - γ·Hqu (σqu: áp lực tại đáy KMQU; Hqu: chiều sâu đến mũi cọc)

Tính lún:
S = σgl·H / E₀ · (1 - μ²) · β (công thức nền đàn hồi)
hoặc phương pháp cộng lún từng lớp nếu có nhiều lớp dưới mũi.

Với 1 lớp đồng nhất và biết E, μ: Dùng công thức nén đơn:
S = σgl·H / (E/(1-2μ²/(1-μ))) ≈ σgl·H / E₀

Kiểm tra: S ≤ [S] = 8cm.`,
kp:["σgl = σqu - γ·H","S = σgl·H/E₀ với nền đồng nhất","Hoặc cộng lún từng lớp nếu phức tạp"]},

// Phá hoại nghiêng đài
{id:82,part:"mong_coc",topic:"Phá hoại tiết diện nghiêng đài",
q:"Điều kiện để kiểm tra phá hoại trên tiết diện nghiêng của đài là gì? Kiểm tra theo mấy phương?",
a:`Kiểm tra 2 dạng đâm thủng:
1. Cột đâm thủng đài: Lực nén từ cột đẩy xuống làm tháp BT 45° bị tách khỏi đài.
Điều kiện: Pdt,cột ≤ Pcdt,cột = α·Rbt·∑btb·h₀

2. Hàng cọc đâm thủng đài: Lực đầu cọc đẩy lên, có thể chọc thủng đài nếu cọc nằm ngoài vùng tháp.
Điều kiện: Pdt,cọc ≤ Pcdt,cọc = α·Rbt·∑btb·h₀ (tính theo cạnh song song với hàng cọc)

Kiểm tra theo 2 phương (cạnh dài và cạnh ngắn của đài).`,
kp:["2 dạng: cột đâm thủng và hàng cọc đâm thủng","Điều kiện: Pdt ≤ Pcdt = α·Rbt·btb·h₀","Kiểm tra 2 phương"]},

{id:83,part:"mong_coc",topic:"Phá hoại tiết diện nghiêng đài",
q:"Đài bị chọc thủng bởi yếu tố nào? Nêu các cách để tăng lực chống đâm thủng của đài.",
a:`Yếu tố gây chọc thủng đài:
- Lực nén từ cột (Ncột) → cột chọc thủng đài từ trên xuống.
- Phản lực đầu cọc (Pcọc) → cọc chọc thủng đài từ dưới lên (khi cọc nằm ngoài vùng tháp chọc thủng từ cột).

Cách tăng lực chống đâm thủng Pcdt:
1. Tăng chiều cao đài h → h₀ tăng → Pcdt tăng (hiệu quả nhất).
2. Tăng cấp độ bền bê tông → Rbt tăng → Pcdt tăng.
3. Tăng kích thước cột → tháp lớn hơn → chu vi trung bình tăng.
4. Tăng kích thước đài → cọc vào trong tháp hơn.`,
kp:["Cột đâm từ trên, cọc từ dưới","Tăng h: hiệu quả nhất","Tăng cấp BT, kích thước cột"]},

{id:84,part:"mong_coc",topic:"Phá hoại tiết diện nghiêng đài",
q:"Tại sao kiểm tra đâm thủng với góc 45°? Cột chọc thủng đài và hàng cọc chọc thủng đài — điều kiện nào nguy hiểm hơn?",
a:`Góc 45°: Tương tự móng nông — mặt phá hoại nghiêng trong bê tông thực nghiệm thường hình thành theo góc này; phản ánh cơ chế truyền lực trong bê tông không cốt thép.

So sánh nguy hiểm:
- Cột đâm thủng đài: Lực lớn, tập trung, tháp có chu vi nhỏ (chỉ quanh cột) → thường nguy hiểm hơn.
- Hàng cọc đâm thủng: Lực phân tán hơn, nhưng nếu cọc nằm sát mép đài (ngoài tháp) → cũng nguy hiểm.

Thực tế: Cần kiểm tra cả hai; điều kiện nào cho ra h₀ yêu cầu lớn hơn thì điều kiện đó nguy hiểm hơn.`,
kp:["Góc 45° từ thực nghiệm BT","Cột đâm thủng thường nguy hiểm hơn","Phải kiểm tra cả 2 điều kiện"]},

// Phá hoại đứng đài
{id:85,part:"mong_coc",topic:"Phá hoại tiết diện đứng đài",
q:"Trình bày cách tính cốt thép theo phương cạnh dài và cạnh ngắn của đài cọc.",
a:`Sơ đồ tính: Đài cọc làm việc như bản ngàm 4 cạnh hoặc console tại mép cột.

Thực tế đồ án: Tính theo sơ đồ console ngàm tại mép cột (đơn giản hóa).

Phương cạnh dài (theo L):
M_L = ΣPcọc_ngoài_mep_cot × khoảng cách từ tim cọc đến mép cột
As_L = M_L / (0.9·h₀·Rs)

Phương cạnh ngắn (theo B):
M_B = ΣPcọc_ngoài_mep_cot_phuong_B × khoảng cách
As_B = M_B / (0.9·h₀·Rs)

Lựa chọn thép: số thanh và đường kính thỏa mãn As_yêu_cầu, khoảng cách ≤ 200mm, thép ≥ Ø12.`,
kp:["Sơ đồ console tại mép cột","M = ΣP_cọc × khoảng cách","As = M / (0.9·h₀·Rs)"]},

{id:86,part:"mong_coc",topic:"Phá hoại tiết diện đứng đài",
q:"Nguyên lý tính toán cốt thép đài móng là gì? Tại sao giả thiết cột ngàm vào đài?",
a:`Nguyên lý: Đài cọc chịu phản lực đầu cọc hướng lên và lực từ cột hướng xuống. Phản lực đầu cọc gây momen uốn tại các mặt cắt qua mép cột → tính cốt thép chịu momen này.

Công thức: As = M_max / (0.9·h₀·Rs) (tiết diện nguy hiểm tại mép cột).

Giả thiết cột ngàm vào đài: Đài rất cứng so với cột → góc xoay tại chân cột gần bằng 0 → mô hình ngàm là hợp lý. Điều này đảm bảo đánh giá đúng momen và lực cắt truyền vào đài từ cột. Nếu không có ngàm, momen tại đầu cột = 0 → momen trong đài giảm → thiếu an toàn.`,
kp:["As = M/(0.9·h₀·Rs)","Đài cứng → cột ngàm là hợp lý","Không ngàm → momen giảm → không an toàn"]},

{id:87,part:"mong_coc",topic:"Phá hoại tiết diện đứng đài",
q:"Tại sao phải bẻ thép cọc 45°? Nêu phương án xử lý nếu trong quá trình đập vỡ đầu cọc bị nứt.",
a:`Bẻ thép 45°: Tăng chiều dài neo và tăng diện tích bám dính trong bê tông đài → đảm bảo lực từ cọc truyền vào đài và ngược lại được đầy đủ. Thép neo thẳng đứng dễ bị kéo ra khi cọc chịu tải kéo.

Xử lý khi đập đầu cọc bị nứt:
1. Nứt ngang nhỏ (< 0.2mm): Có thể chấp nhận nếu nứt không xuyên qua tiết diện và nằm trong đoạn đập bỏ.
2. Nứt dọc: Nguy hiểm hơn — có thể làm yếu tiết diện cọc → cần đánh giá, xem xét gia cố bằng thép đai bổ sung.
3. Nứt nghiêm trọng: Phải đóng/ép cọc bổ sung; không sử dụng cọc bị nứt qua tiết diện làm việc.`,
kp:["Bẻ 45°: tăng chiều dài neo","Nứt ngang nhỏ: chấp nhận nếu trong đoạn đập","Nứt nghiêm trọng: cọc bổ sung"]}
];

// ═══════════ STATE ═══════════
let currentUser = "";
let answeredIds = new Set();
let ratings = [];   // "good" | "partial" | "bad"
let currentFilter = "all";
let currentQ = null;
let progressData = {}; // { [name]: {ids:[], ratings:[], lastActive} }

// ═══════════ STORAGE ═══════════
function loadAll() {
  try { progressData = JSON.parse(localStorage.getItem("nm_data") || "{}"); } catch { progressData = {}; }
}
function saveAll() {
  try { localStorage.setItem("nm_data", JSON.stringify(progressData)); } catch {}
}
function loadUser(name) {
  const d = progressData[name] || {};
  answeredIds = new Set(d.ids || []);
  ratings = d.ratings || [];
}
function saveUser() {
  progressData[currentUser] = { ids: [...answeredIds], ratings, lastActive: new Date().toISOString() };
  saveAll();
}

// ═══════════ UI HELPERS ═══════════
function showScreen(id) {
  ["landing","quiz","teacher"].forEach(s => {
    document.getElementById("screen-" + s).classList.add("hidden");
  });
  document.getElementById("screen-" + id).classList.remove("hidden");
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ═══════════ LANDING ═══════════
document.getElementById("name-input").addEventListener("input", function() {
  document.getElementById("btn-start").disabled = !this.value.trim();
});
document.getElementById("name-input").addEventListener("keydown", e => { if(e.key==="Enter") startQuiz(); });
document.getElementById("btn-start").addEventListener("click", startQuiz);

function startQuiz() {
  const n = document.getElementById("name-input").value.trim();
  if (!n) return;
  currentUser = n;
  loadAll();
  loadUser(n);
  currentFilter = "all";
  setScreen_quiz();
}

function toggleTeacherLogin() {
  document.getElementById("teacher-toggle-row").classList.add("hidden");
  document.getElementById("teacher-login-form").classList.remove("hidden");
  document.getElementById("teacher-code-input").focus();
}
document.getElementById("teacher-code-input").addEventListener("keydown", e => { if(e.key==="Enter") loginTeacher(); });

function loginTeacher() {
  const v = document.getElementById("teacher-code-input").value.trim();
  if (v !== TEACHER_CODE) {
    document.getElementById("teacher-error").textContent = "Mã không đúng.";
    document.getElementById("teacher-error").classList.remove("hidden");
    return;
  }
  renderTeacher();
  showScreen("teacher");
}
function goLanding() {
  document.getElementById("teacher-toggle-row").classList.remove("hidden");
  document.getElementById("teacher-login-form").classList.add("hidden");
  document.getElementById("teacher-code-input").value = "";
  document.getElementById("teacher-error").classList.add("hidden");
  showScreen("landing");
}

// ═══════════ QUIZ ═══════════
function setScreen_quiz() {
  showScreen("quiz");
  updateHeader();
  pickQuestion();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  pickQuestion();
}

function getPool() {
  return QA.filter(q => !answeredIds.has(q.id) && (currentFilter === "all" || q.part === currentFilter));
}

function pickQuestion() {
  const pool = getPool();
  if (pool.length === 0) { renderDone(); return; }
  currentQ = pool[Math.floor(Math.random() * pool.length)];
  renderQuestion();
}

function updateHeader() {
  const total = answeredIds.size;
  const good = ratings.filter(r => r === "good").length;
  document.getElementById("hdr-name").textContent = currentUser;
  document.getElementById("hdr-done").textContent = total + "/" + TOTAL;
  document.getElementById("hdr-good").textContent = good;
  document.getElementById("hdr-progress").style.width = Math.round(total/TOTAL*100) + "%";
}

function renderQuestion() {
  const pool = getPool();
  const html = `
    <div class="badge-row">
      <span class="badge badge-navy">${currentQ.part === "mong_don" ? "Móng đơn / Băng" : "Móng cọc"}</span>
      <span class="badge badge-blue">${currentQ.topic}</span>
      <span class="remaining">Còn ${pool.length} câu trong phần này</span>
    </div>
    <div class="question-card">
      <div class="q-label">Câu hỏi bảo vệ</div>
      <div class="q-text">${currentQ.q}</div>
    </div>
    <div class="answer-card">
      <label class="field-label">Câu trả lời của bạn (gõ như đang trả lời hội đồng)</label>
      <textarea class="text-input" id="sv-answer" placeholder="Viết câu trả lời của bạn tại đây..."></textarea>
      <p class="answer-hint">💡 Hãy cố gắng trả lời trước khi xem đáp án gợi ý</p>
      <div class="btn-row">
        <button class="btn" id="btn-show-answer" onclick="showAnswer()">Xem đáp án gợi ý →</button>
      </div>
    </div>`;
  document.getElementById("screen-quiz-inner").innerHTML = html;
  document.getElementById("sv-answer").focus();
}

function showAnswer() {
  const q = currentQ;
  const kpHtml = q.kp ? `<div class="key-points"><div class="kp-title">Ý chính cần có</div><ul>${q.kp.map(k=>`<li>${k}</li>`).join("")}</ul></div>` : "";
  const modelHtml = `
    <div class="model-answer-wrap" id="model-wrap">
      <div class="model-answer-header" onclick="toggleModel()">
        <span>📖 Đáp án gợi ý</span>
        <span class="toggle-icon" id="toggle-icon">▼</span>
      </div>
      <div class="model-answer-body open" id="model-body">
        <div class="answer-text">${q.a}</div>
        ${kpHtml}
      </div>
    </div>
    <div class="self-rate">
      <div class="sr-title">Bạn tự đánh giá câu trả lời của mình:</div>
      <div class="rate-btns">
        <button class="rate-btn rate-good" onclick="rate('good',this)">
          <span class="rate-icon">✅</span>Nắm vững
        </button>
        <button class="rate-btn rate-partial" onclick="rate('partial',this)">
          <span class="rate-icon">⚠️</span>Còn thiếu
        </button>
        <button class="rate-btn rate-bad" onclick="rate('bad',this)">
          <span class="rate-icon">❌</span>Chưa hiểu
        </button>
      </div>
    </div>`;
  document.getElementById("btn-show-answer").parentElement.parentElement.insertAdjacentHTML("afterend", modelHtml);
  document.getElementById("btn-show-answer").disabled = true;
  document.getElementById("btn-show-answer").textContent = "Đã xem đáp án";
}

function toggleModel() {
  const body = document.getElementById("model-body");
  const icon = document.getElementById("toggle-icon");
  body.classList.toggle("open");
  icon.textContent = body.classList.contains("open") ? "▼" : "▶";
}

function rate(r, btn) {
  document.querySelectorAll(".rate-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  // Record locally
  answeredIds.add(currentQ.id);
  ratings.push(r);
  saveUser();
  updateHeader();
  // Sync to Google Sheet
  sendToSheet(currentUser, currentQ, r);
  // Add next button
  const existingNext = document.getElementById("btn-next");
  if (!existingNext) {
    const nextBtn = document.createElement("button");
    nextBtn.className = "btn btn-gold";
    nextBtn.id = "btn-next";
    nextBtn.style.marginTop = "16px";
    nextBtn.textContent = "Câu tiếp theo →";
    nextBtn.onclick = () => { pickQuestion(); window.scrollTo(0,0); };
    document.querySelector(".self-rate").appendChild(nextBtn);
  }
  const labels = {good:"✅ Ghi nhận: Nắm vững!", partial:"⚠️ Ghi nhận: Ôn lại phần còn thiếu!", bad:"❌ Ghi nhận: Cần ôn kỹ hơn!"};
  toast(labels[r]);
}

function renderDone() {
  const good = ratings.filter(r=>r==="good").length;
  const partial = ratings.filter(r=>r==="partial").length;
  const bad = ratings.filter(r=>r==="bad").length;
  const label = currentFilter === "all" ? "tất cả" : currentFilter === "mong_don" ? "Móng đơn/Băng" : "Móng cọc";
  document.getElementById("screen-quiz-inner").innerHTML = `
    <div class="done-card">
      <div class="done-icon">🎉</div>
      <h3>Hoàn thành phần ${label}!</h3>
      <p style="margin-top:12px">Nắm vững: <strong style="color:var(--green)">${good}</strong> câu &nbsp;|&nbsp;
        Còn thiếu: <strong style="color:var(--orange)">${partial}</strong> câu &nbsp;|&nbsp;
        Chưa hiểu: <strong style="color:var(--red)">${bad}</strong> câu</p>
      <p style="margin-top:8px;font-size:13px">Tổng đã làm: <strong>${answeredIds.size}/${TOTAL}</strong> câu</p>
      <div style="display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-gold" style="width:auto;padding:12px 24px"
          onclick="resetFilter()">Ôn phần khác</button>
        <button class="btn" style="width:auto;padding:12px 24px;background:var(--red)"
          onclick="resetAll()">🔄 Làm lại từ đầu</button>
      </div>
    </div>`;
}

function resetFilter() {
  document.querySelectorAll(".tab-btn")[0].click();
}

function resetAll() {
  if (!confirm("Xoá toàn bộ tiến độ và làm lại từ đầu?")) return;
  answeredIds = new Set();
  ratings = [];
  saveUser();
  updateHeader();
  pickQuestion();
}

// ═══════════ TEACHER DASHBOARD ═══════════
function renderTeacher() {
  loadAll();
  const data = Object.entries(progressData).map(([name, d]) => {
    const ids = d.ids || [];
    const r = d.ratings || [];
    return {
      name,
      total: ids.length,
      good: r.filter(x=>x==="good").length,
      partial: r.filter(x=>x==="partial").length,
      bad: r.filter(x=>x==="bad").length,
      lastActive: d.lastActive || null
    };
  }).sort((a,b) => b.total - a.total);

  const active = data.filter(d=>d.total>0).length;
  const notStarted = data.filter(d=>d.total===0).length;
  const avgPct = data.length ? Math.round(data.reduce((s,d)=>s+d.total,0)/data.length/TOTAL*100) : 0;

  const rows = data.map((d,i) => {
    const pct = Math.round(d.total/TOTAL*100);
    const barColor = pct>=60?"var(--green)":pct>=30?"var(--gold)":"var(--red)";
    const la = d.lastActive ? new Date(d.lastActive).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
    return `<tr>
      <td style="color:var(--sub)">${i+1}</td>
      <td style="font-weight:700">${d.name}</td>
      <td><span class="chip chip-blue">${d.total}/${TOTAL}</span></td>
      <td><span class="chip chip-green">${d.good}</span></td>
      <td style="color:var(--orange);font-weight:700">${d.partial}</td>
      <td style="color:var(--red);font-weight:700">${d.bad}</td>
      <td>
        <div class="pbar-wrap">
          <div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <span style="font-size:12px;color:var(--sub)">${pct}%</span>
        </div>
      </td>
      <td style="color:var(--sub);font-size:12px">${la}</td>
    </tr>`;
  }).join("");

  document.getElementById("teacher-content").innerHTML = `
    <div id="screen-teacher-inner" style="max-width:900px;margin:0 auto;padding:24px 20px">
      <div class="dash-stats">
        <div class="dash-stat"><div class="ds-val" style="color:var(--navy)">${data.length}</div><div class="ds-lbl">Tổng sinh viên</div></div>
        <div class="dash-stat"><div class="ds-val" style="color:var(--green)">${active}</div><div class="ds-lbl">Đã bắt đầu ôn</div></div>
        <div class="dash-stat"><div class="ds-val" style="color:var(--red)">${notStarted}</div><div class="ds-lbl">Chưa ôn tập</div></div>
        <div class="dash-stat"><div class="ds-val" style="color:var(--gold)">${avgPct}%</div><div class="ds-lbl">TB % hoàn thành</div></div>
      </div>
      <div class="table-card">
        <div class="table-header">
          <h3>Danh sách sinh viên (${data.length})</h3>
          <button onclick="renderTeacher()" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit">🔄 Làm mới</button>
        </div>
        ${data.length === 0
          ? `<div style="padding:48px;text-align:center;color:var(--sub)">Chưa có sinh viên nào đăng nhập trên thiết bị này</div>`
          : `<div style="overflow-x:auto"><table>
              <thead><tr>
                <th>#</th><th>Họ tên</th><th>Đã làm</th>
                <th>✅ Vững</th><th>⚠️ Thiếu</th><th>❌ Chưa hiểu</th>
                <th>% Hoàn thành</th><th>Lần cuối</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table></div>`
        }
      </div>
      <p style="text-align:center;color:#94a3b8;font-size:11px;margin-top:14px">
        Dữ liệu lưu tại máy này (localStorage) · Mã GV: <strong>${TEACHER_CODE}</strong>
      </p>
    </div>`;
}

// ═══════════ GOOGLE SHEET SYNC ═══════════
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwi8elFbi8dkN4qb8eB0gbeRd6GoKC6TCY6vmPwD4srY-ukTlUJmCbwJU8wVwOUQsy8/exec";

function sendToSheet(name, q, rating) {
  const PART_LABEL = { mong_don: "Móng đơn / Băng", mong_coc: "Móng cọc" };
  const RATING_LABEL = { good: "✅ Nắm vững", partial: "⚠️ Còn thiếu", bad: "❌ Chưa hiểu" };
  const params = new URLSearchParams({
    name: name,
    part: PART_LABEL[q.part] || q.part,
    topic: q.topic,
    question: q.q.substring(0, 200),
    rating: RATING_LABEL[rating] || rating
  });
  fetch(SHEET_URL + "?" + params.toString(), { method: "GET", mode: "no-cors" })
    .catch(() => {});
}

// ═══════════ INIT ═══════════
loadAll();
showScreen("landing");
</script>
